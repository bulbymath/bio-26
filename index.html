,"one of a pair of cells that open and close a stoma","when turgid it bows outward and opens the pore; when flaccid it closes","it balances the need for CO2 against the cost of losing water","closing at night cuts water loss when photosynthesis cannot run","epidermal cell - a flat protective cell without chloroplasts","palisade cell - a photosynthetic cell beneath the epidermis","stoma - the pore itself, not the cell beside it"],["plant","transport",1,"transpiration","the evaporation of water from the surfaces of leaf cells","it happens mainly through the stomata into the air spaces","it creates the tension that pulls the water column up the xylem","it is a consequence of gas exchange, not a purpose in itself","translocation - movement of sugars in the phloem","respiration - release of energy from glucose","guttation - droplets forced out of leaf margins, not evaporation"],["plant","transport",2,"transpiration stream","the continuous flow of water from root to leaf through xylem","it is driven by evaporation at the top and cohesion between water molecules","it delivers water and dissolved minerals to every leaf","it also cools the leaf by evaporation","translocation - the phloem sugar stream","root pressure - a minor upward push from the roots","capillary action - adhesion to xylem walls, a supporting effect"],["plant","transport",3,"cohesion-tension","the mechanism by which water is pulled up the xylem","water molecules hydrogen-bond to each other, forming a continuous chain","evaporation at the leaf pulls the whole chain upward like a rope","if the column breaks, an air bubble blocks that vessel","adhesion - water sticking to the xylem wall rather than to itself","root pressure - a push from below rather than a pull from above","translocation - energy-driven flow in phloem"],["plant","transport",3,"lignin","the hard, waterproof polymer laid down in xylem walls","it thickens the wall and seals it against leakage","it stops the vessel collapsing under tension and keeps water inside","it is also why wood is rigid","cellulose - the flexible structural polysaccharide of plant cell walls","suberin - the waxy polymer in cork cells","chitin - the structural polysaccharide of fungi"],["plant","transport",2,"potometer","an apparatus that measures water uptake by a shoot","an air bubble moves along a capillary as the shoot draws water","uptake is used as an estimate of transpiration rate","it measures uptake, not evaporation, so the two differ slightly","respirometer - measures oxygen uptake or CO2 release","colorimeter - measures light absorbance","thermometer - measures temperature only"],["plant","organs",1,"palisade mesophyll","the layer of tall, chloroplast-rich cells near the upper leaf surface","the cells are packed with chloroplasts and arranged in columns","most photosynthesis happens here because light arrives first","their shape packs many chloroplasts into a small volume","spongy mesophyll - loose cells with air spaces below","epidermis - the transparent outer layer","xylem - the water-conducting tissue in the vein"],["plant","organs",2,"spongy mesophyll","the loosely packed cell layer in the lower half of the leaf","large air spaces run between the cells","they let carbon dioxide reach the palisade cells by diffusion","the loose packing also gives a large internal surface for gas exchange","palisade mesophyll - the densely packed upper layer","stoma - the pore the air enters through","cuticle - the waxy layer above the epidermis"],["plant","organs",1,"epidermis","the single outer layer of cells covering a leaf","it is transparent and secretes a waxy cuticle","it protects the leaf while letting light through to the mesophyll","being transparent is essential - an opaque skin would block photosynthesis","cuticle - the waxy secretion on its outer surface","mesophyll - the photosynthetic tissue beneath it","periderm - the corky outer layer of older stems"],["plant","organs",2,"cuticle","the waxy layer on the outer surface of the epidermis","it is waterproof and reflective","it cuts evaporation from the leaf surface to a minimum","most water loss therefore happens through stomata, which can be closed","stoma - the controllable pore that bypasses the cuticle","lignin - the waterproof polymer inside xylem walls","suberin - the waxy polymer in cork"],["plant","organs",2,"vascular bundle","a strand containing both xylem and phloem","the xylem sits on the upper side, the phloem on the lower","it supplies water to the leaf and exports the sugar made there","in a leaf these bundles appear as the veins","pith - the central tissue of a stem","mesophyll - the photosynthetic tissue","cambium - the dividing layer inside the bundle"],["plant","minerals",2,"nitrate ions","mineral ions absorbed by roots and used to build amino acids","nitrogen is a required element in every protein and in DNA","without them the plant cannot make proteins or grow new tissue","deficiency shows as stunted growth and yellowing older leaves","magnesium ions - needed for chlorophyll, not for protein","phosphate ions - needed for DNA and membranes","potassium ions - needed for enzyme action and turgor"],["plant","minerals",3,"magnesium ions","mineral ions needed to build the chlorophyll molecule","magnesium sits at the centre of every chlorophyll molecule","without it the plant cannot make chlorophyll, so leaves turn yellow","deficiency shows as yellowing between the veins of older leaves","nitrate ions - needed for amino acids and proteins","iron ions - a cofactor in chlorophyll synthesis, not part of the molecule","calcium ions - needed for cell wall strength"],["plant","minerals",3,"nitrate deficiency","a shortage of nitrogen available to the plant","the plant cannot synthesise enough amino acids and proteins","growth is stunted and older leaves turn yellow as nitrogen is relocated","the plant salvages nitrogen from old leaves to protect new growth","magnesium deficiency - yellowing between veins with green margins","wilting - loss of turgor, a water problem not a mineral one","chlorosis from lack of light - yellowing without a mineral cause"],["plant","transport",2,"translocation","the movement of dissolved sugars through the phloem","sucrose is actively loaded into the phloem at a source","it is carried to sinks where it is unloaded and used or stored","unlike transpiration, it requires energy from respiration","transpiration - water movement in xylem, passive","osmosis - water movement across a membrane","diffusion - passive movement down a concentration gradient"],["plant","transport",3,"source","a part of the plant that loads sugar into the phloem","typically a mature leaf where photosynthesis exceeds its own needs","sugar is exported from here towards growing or storage regions","a storage organ can become a source in spring when it mobilises reserves","sink - a region that unloads sugar","xylem - the tissue that carries water rather than sugar","stoma - the pore for gas exchange"],["plant","transport",3,"sink","a part of the plant that unloads sugar from the phloem","roots, fruits, seeds and growing tips all draw sugar in","sugar arriving here is used for growth, respiration or storage","the same organ can switch between source and sink over a season","source - a region that loads sugar into the phloem","transpiration stream - the water flow in xylem","lignin - a structural polymer, not a sugar destination"],["plant","water",2,"turgor","the pressure of cell contents pushing outward on the cell wall","water entering by osmosis inflates the vacuole","it keeps soft tissue firm and holds stems and leaves upright","loss of turgor is what wilting actually is","plasmolysis - the cell membrane pulling away from the wall in a shrivelled cell","osmosis - the water movement that creates turgor","transpiration - the water loss that reduces it"],["plant","water",2,"wilting","the drooping of leaves and stems caused by loss of turgor","water is evaporating faster than the roots can absorb it","cells become flaccid and can no longer support the leaf","it is a temporary water shortage, not necessarily death","plasmolysis - irreversible shrinkage of the cell contents","transpiration - the process that caused the loss","chlorosis - yellowing from a mineral deficiency"],["plant","water",3,"stomatal closure","the shutting of stomata by loss of guard cell turgor","guard cells become flaccid and the pore between them closes","water loss falls sharply but carbon dioxide entry also stops","this is why photosynthesis slows on a hot dry afternoon","wilting - loss of turgor in the whole leaf","transpiration - the water loss being reduced","guttation - water forced out as droplets"],["plant","water",3,"root pressure","a small upward push on water generated in the roots","mineral ions are actively pumped into the xylem, drawing water in by osmosis","it contributes a minor part of the upward flow","it is too weak to raise water to the top of a tall tree on its own","cohesion-tension - the main upward mechanism","transpiration - the evaporative pull from the leaves","translocation - sugar movement in the phloem"],["plant","water",2,"transpiration rate","the speed at which water vapour leaves the plant","it depends on light, temperature, humidity and wind speed","these factors change the water vapour gradient between leaf and air","exam questions almost always ask which factor and why","translocation rate - speed of sugar transport, a different process","photosynthesis rate - carbon fixation, not water loss","uptake rate - water entering the roots"],["plant","water",3,"wind and transpiration","the effect of moving air on water loss from leaves","wind sweeps away the layer of humid air around the leaf","the water vapour gradient steepens, so evaporation speeds up","this is why a breezy day dries washing faster","humidity and transpiration - the opposite effect","temperature and transpiration - a separate factor","stomatal closure - the plants defence against excessive loss"],["plant","water",3,"humidity and transpiration","the effect of atmospheric water vapour on water loss","humid air already contains much water vapour","the gradient from leaf to air is shallow, so transpiration slows","in a sealed humid chamber a shoot may lose almost no water","wind and transpiration - removes the humid layer and speeds loss","temperature and transpiration - warm air holds more vapour","root pressure - an upward push unrelated to humidity"],["photo","equation",1,"photosynthesis","the process in which plants use light energy to build glucose from carbon dioxide and water","chlorophyll absorbs light, and the energy drives carbon fixation","glucose is stored as starch and oxygen is released","it is the reverse of respiration in terms of reactants and products","respiration - releases energy by breaking down glucose","transpiration - loss of water vapour from leaves","translocation - movement of sugars in the phloem"],["photo","equation",1,"word equation for photosynthesis","carbon dioxide + water -> glucose + oxygen, using light energy and chlorophyll","light is absorbed by chlorophyll and drives the reaction","the products are a storable fuel and the oxygen we breathe","the arrow needs both light and chlorophyll written above it","respiration word equation - glucose + oxygen -> CO2 + water","combustion equation - burning releases the energy at once","translocation equation - there is no such equation"],["photo","equation",2,"balanced symbol equation for photosynthesis","6CO2 + 6H2O -> C6H12O6 + 6O2","six carbon dioxide and six water molecules make one glucose and six oxygen","the numbers must balance because atoms are conserved","the same equation reversed is aerobic respiration","6O2 + C6H12O6 -> 6CO2 + 6H2O - that is respiration","CO2 + H2O -> H2CO3 - that is carbonic acid formation","2H2O -> 2H2 + O2 - that is electrolysis"],["photo","chloroplast",1,"chlorophyll","the green pigment that absorbs light energy","it absorbs mainly red and blue light and reflects green","the absorbed energy drives the light-dependent stage","green leaves reflect green light, which is why they look green","haemoglobin - the red oxygen-carrying pigment in blood","carotene - an accessory pigment absorbing other wavelengths","melanin - the dark skin pigment in animals"],["photo","chloroplast",1,"chloroplast","the organelle in which photosynthesis takes place","it has stacked thylakoid membranes surrounded by stroma","the two stages occur in its two compartments","it is not found in root cells, which is why roots cannot photosynthesise","mitochondrion - the site of aerobic respiration","nucleus - contains DNA, not photosynthetic membranes","vacuole - stores water and solutes"],["photo","chloroplast",3,"thylakoid","a flattened membrane sac inside a chloroplast","the membranes carry chlorophyll and the electron transport proteins","the light-dependent stage happens on these membranes","they are stacked into grana to pack in more membrane","stroma - the fluid around the thylakoids","granum - a stack of thylakoids","cristae - the folds of the inner mitochondrial membrane"],["photo","chloroplast",3,"granum","a stack of thylakoid membranes","stacking packs a large membrane area into a small volume","more membrane means more chlorophyll and faster light absorption","chloroplasts contain many grana, all linked by lamellae","stroma - the fluid between the grana","cristae - mitochondrial folds, not chloroplast stacks","stoma - a leaf pore, easily confused by name"],["photo","chloroplast",3,"stroma","the fluid-filled space inside a chloroplast","it contains the enzymes of the Calvin cycle","carbon fixation happens here, using ATP and NADPH from the thylakoids","it surrounds the grana like cytoplasm around organelles","thylakoid - the membrane where light is absorbed","matrix - the equivalent fluid inside a mitochondrion","cytoplasm - the fluid of the whole cell"],["photo","stages",3,"light-dependent stage","the first stage of photosynthesis, on the thylakoid membranes","light energy splits water and energises electrons","it produces ATP, NADPH and oxygen as a by-product","the oxygen released comes from water, not from carbon dioxide","Calvin cycle - the light-independent stage in the stroma","glycolysis - the first stage of respiration","photolysis - one reaction within this stage"],["photo","stages",3,"photolysis","the splitting of water by light energy","light energy breaks water into hydrogen ions, electrons and oxygen","it supplies the electrons and protons the light stage needs","the oxygen gas released is a by-product of this splitting","hydrolysis - breaking a bond with water, a different reaction","carbon fixation - attaching CO2 to a carbon acceptor","oxidation - loss of electrons, the opposite direction"],["photo","stages",3,"Calvin cycle","the light-independent stage of photosynthesis, in the stroma","carbon dioxide is fixed onto a five-carbon acceptor using ATP and NADPH","the cycle builds triose phosphate, which becomes glucose","it is called light-independent but still needs the products of the light stage","Krebs cycle - the respiration cycle in the mitochondrial matrix","light-dependent stage - the thylakoid stage that feeds it","photolysis - splitting water, not fixing carbon"],["photo","stages",3,"carbon fixation","the attachment of carbon dioxide to an organic acceptor molecule","the enzyme rubisco joins CO2 to a five-carbon sugar","the fixed carbon is reduced to triose phosphate and then to glucose","this is the step that actually removes CO2 from the atmosphere","photolysis - splitting water, which releases oxygen","respiration - the reverse release of CO2","translocation - moving the sugar afterwards"],["photo","products",2,"glucose uses in a plant","the fates of the glucose made in photosynthesis","it can be respired, converted to starch, made into cellulose, or combined with nitrate to form amino acids","starch is the insoluble store; cellulose builds walls; amino acids build proteins","starch is used for storage because it is insoluble and does not affect osmosis","starch - the storage polysaccharide made from glucose","cellulose - the structural polysaccharide in cell walls","sucrose - the transport sugar moved in the phloem"],["photo","products",2,"starch","the insoluble storage carbohydrate in plants","glucose units are joined into a compact, osmotically inactive molecule","it can be broken down later to release glucose for respiration","iodine solution turns blue-black in its presence","glycogen - the animal storage carbohydrate","cellulose - structural, not storage","sucrose - soluble and used for transport"],["photo","factors",1,"limiting factor","the factor in shortest supply that holds the rate below its maximum","raising it increases the rate; raising any other factor does not","the graph plateaus once a different factor becomes limiting","the classic three are light intensity, CO2 concentration and temperature","optimum - the best level of a factor, not the limiting one","rate of reaction - the quantity being limited","carrying capacity - a population concept, not a rate limit"],["photo","factors",2,"light intensity as a limiting factor","the amount of light energy reaching the chloroplasts","more light means more excitation of chlorophyll electrons","the rate rises steadily then plateaus when CO2 or temperature limits","at very high intensity the leaf may overheat or bleach","CO2 concentration as a limiting factor - the availability of carbon dioxide for fixation","temperature as a limiting factor - the effect of heat on photosynthetic enzymes","day length - the duration of light, a different variable"],["photo","factors",2,"carbon dioxide concentration as a limiting factor","the availability of CO2 for carbon fixation","CO2 diffuses in through the stomata and is fixed by rubisco","raising it increases the rate until light or temperature limits","greenhouses enrich CO2 for exactly this reason","light intensity as a limiting factor - the amount of energy reaching the chloroplasts","oxygen concentration - a product, not a raw material","humidity - affects water loss, not carbon supply"],["photo","factors",2,"temperature as a limiting factor","the effect of heat on the enzymes of photosynthesis","enzyme activity rises with temperature up to an optimum","above the optimum the enzymes denature and the rate collapses","this is why the curve rises then falls sharply","light intensity as a limiting factor - the amount of energy reaching the chloroplasts","pH - relevant to enzymes but not usually varied in leaves","wind speed - affects transpiration, not enzyme rate"],["photo","factors",3,"compensation point","the light intensity at which photosynthesis exactly balances respiration","at this point carbon dioxide uptake equals carbon dioxide release","there is no net gas exchange with the atmosphere","below it the plant loses mass; above it the plant gains mass","limiting factor - what caps the rate, not where the balance lies","optimum - the best condition, not the break-even point","saturation point - where the rate stops rising"],["photo","factors",3,"optimum temperature for photosynthesis","the temperature at which the photosynthetic rate is highest","enzyme-controlled reactions peak just below the point of denaturation","above it, bonds break and the active sites lose shape","the optimum for a temperate plant is roughly 25 to 35 degrees","denaturation - the irreversible loss of enzyme shape","limiting factor - the factor in shortest supply","compensation point - the break-even light level"],["photo","adaptations",2,"leaf adaptations for photosynthesis","the features that make a leaf an efficient photosynthetic organ","a large flat surface, thin blade, transparent epidermis, palisade layer and stomata","together they maximise light capture and gas exchange while limiting water loss","state the feature and then say what it achieves - marks are for the link","root hair cell adaptations - maximise water uptake instead","alveolar adaptations - maximise gas exchange in animals","stomatal closure - a response, not a structural adaptation"],["photo","adaptations",3,"stomata and carbon dioxide entry","the route by which CO2 reaches the chloroplasts","CO2 diffuses through the stomata into the air spaces of the spongy mesophyll","from there it diffuses into cells and chloroplasts down its gradient","closing stomata to save water also shuts off the CO2 supply","transpiration - water vapour leaving by the same route","photolysis - splitting water inside the chloroplast","carbon fixation - the step after CO2 has arrived"],["photo","practical",2,"variegated leaf experiment","an experiment using a leaf with green and white patches","only the green regions contain chlorophyll","after light exposure, only the green regions test positive for starch","the white patches are the built-in control","destarching - removing existing starch before the test","iodine test - the starch detection step","DCPIP - a different assay, for electron acceptors"],["photo","practical",1,"iodine test for starch","a test in which iodine solution turns blue-black with starch","iodine binds inside the coiled starch helix and changes colour","a positive result proves the leaf made starch from glucose","the leaf must be boiled in ethanol to remove chlorophyll first","Benedict test - detects reducing sugars, not starch","Biuret test - detects protein","limewater - detects carbon dioxide"],["photo","practical",3,"destarching a plant","keeping a plant in the dark before a photosynthesis experiment","in darkness, existing starch is broken down and transported away","any starch found afterwards must have been made during the test","without it, old starch would give a false positive","variegated leaf - the alternative built-in control","iodine test - the detection step that follows","starvation - a different concept, about lacking nutrients"],["photo","comparison",2,"photosynthesis and respiration compared","the two gas-exchanging processes in a plant","photosynthesis takes in CO2 and releases O2 in light; respiration does the reverse all the time","a plant does both at once, and the net gas exchange depends on light level","at night a plant is a net consumer of oxygen, just like an animal","compensation point - where the two exactly cancel","transpiration - water loss, a third separate process","translocation - sugar transport, not gas exchange"],["enz","mechanism",1,"enzyme","a protein that speeds up a reaction without being used up","it provides an active site where substrates bind","the reaction happens far faster than it would unaided","the enzyme is unchanged at the end, so it can be reused","substrate - the molecule the enzyme acts on","hormone - a chemical messenger, not a catalyst","cofactor - a helper ion or molecule, not the enzyme itself"],["enz","mechanism",1,"active site","the region of an enzyme where the substrate binds","it is a small pocket with a shape complementary to the substrate","only substrates that fit can react, which is the basis of specificity","it is formed by a few amino acids, not the whole protein","allosteric site - a separate regulatory site, not the catalytic one","binding site on a carrier protein - transport, not catalysis","substrate - the molecule that fits into it"],["enz","mechanism",1,"substrate","the molecule an enzyme acts on","it binds at the active site to form an enzyme-substrate complex","it is converted into products, which are then released","its concentration affects the rate until the enzyme is saturated","enzyme - the catalyst acting on it","product - what it becomes after the reaction","inhibitor - a molecule that blocks the enzyme instead"],["enz","mechanism",2,"enzyme-substrate complex","the temporary union of enzyme and substrate","the substrate sits in the active site while bonds are strained","this is the moment the reaction is actually catalysed","it lasts only a fraction of a second before products leave","active site - the pocket it forms in","product - released once the complex breaks apart","enzyme-product complex - a transient stage after catalysis"],["enz","mechanism",2,"lock and key model","an early model of enzyme action","the active site is a rigid shape into which only one substrate fits","it explains specificity but not why binding changes the enzyme","it is now largely replaced by the induced fit model","induced fit model - the modern, more accurate description","active site - the lock in the analogy","substrate - the key in the analogy"],["enz","mechanism",3,"induced fit model","the current model of enzyme action","the active site is flexible and moulds around the substrate as it binds","this closer fit strains the substrate bonds and lowers activation energy","it explains why some enzymes act on a family of similar substrates","lock and key model - the older rigid model","active site - the region that changes shape","activation energy - the barrier that is being lowered"],["enz","mechanism",2,"specificity","the property by which an enzyme acts on only one or a few substrates","the active site shape is complementary to that substrate alone","a differently shaped molecule cannot bind, so no reaction occurs","this is why one enzyme cannot digest every kind of molecule","induced fit - the flexibility that still allows specificity","denaturation - loss of shape that destroys specificity","inhibitor - a molecule that mimics the substrate and blocks it"],["enz","mechanism",3,"activation energy","the energy barrier a reaction must overcome to proceed","enzymes lower it by holding substrates in a favourable orientation","a lower barrier means the reaction happens at body temperature","enzymes do not add energy; they reduce what is needed","optimum temperature - the condition for maximum rate, not the barrier","denaturation - destruction of the catalyst","catalyst - a substance that lowers the barrier"],["enz","factors",1,"denaturation","the irreversible loss of an enzymes shape","heat or extreme pH breaks the hydrogen bonds holding the active site","the substrate no longer fits, so the rate falls to zero","it cannot be reversed by cooling back down","optimum temperature - the peak before denaturation begins","inhibition - blocking without destroying the shape","coagulation - clumping of protein, a related but broader change"],["enz","factors",1,"optimum temperature","the temperature at which an enzyme works fastest","kinetic energy and shape stability are balanced at this point","above it, denaturation begins and the rate drops sharply","for human enzymes this is usually around 37 degrees","optimum pH - the equivalent for acidity","denaturation - what happens beyond the optimum","activation energy - unrelated to the peak"],["enz","factors",2,"optimum pH","the pH at which an enzyme is most active","the charge on the active site amino acids is optimal there","away from it, the active site distorts and activity falls","pepsin works at about pH 2, amylase at about pH 7","optimum temperature - the equivalent for heat","denaturation - the extreme result of moving too far from it","buffer - a solution that holds pH steady"],["enz","factors",2,"temperature and enzyme rate","how heat changes the rate of an enzyme-controlled reaction","molecules move faster, so collisions with the active site increase","the rate rises until the optimum, then falls sharply as enzymes denature","the fall is steep and irreversible, unlike the rise","pH and enzyme rate - the other shape-sensitive factor","substrate concentration - raises rate until saturation","denaturation - the cause of the fall"],["enz","factors",3,"pH and enzyme rate","how acidity changes the rate of an enzyme-controlled reaction","hydrogen ion concentration alters the charge and shape of the active site","the rate peaks at the optimum pH and falls either side","extreme pH denatures the enzyme permanently","temperature and enzyme rate - the other main shape factor","buffer solution - keeps pH constant in an experiment","inhibition - a different way of reducing rate"],["enz","factors",2,"substrate concentration and enzyme rate","how the amount of substrate changes the rate","more substrate means more collisions with active sites","the rate rises then plateaus when every active site is occupied","the plateau proves the enzyme, not the substrate, is now limiting","enzyme concentration - the other side of the same relationship","limiting factor - the general principle at work","denaturation - unrelated to saturation"],["enz","factors",2,"enzyme concentration and enzyme rate","how the amount of enzyme changes the rate","more enzyme molecules means more active sites available","the rate rises in direct proportion if substrate is plentiful","doubling the enzyme roughly doubles the rate at low concentrations","substrate concentration - the other variable in the same graph","saturation - the point where adding enzyme stops helping","catalyst - the general class the enzyme belongs to"],["enz","inhibition",3,"competitive inhibitor","a molecule that resembles the substrate and binds the active site","it occupies the site so the real substrate cannot","the rate falls, but a very high substrate concentration can outcompete it","its effect can be reduced by adding more substrate","non-competitive inhibitor - binds elsewhere and changes the shape","denaturation - destroys the enzyme rather than blocking it","substrate - the molecule it imitates"],["enz","inhibition",3,"non-competitive inhibitor","a molecule that binds away from the active site","it changes the shape of the active site so the substrate no longer fits","adding more substrate does not restore the rate","its effect cannot be outcompeted","competitive inhibitor - binds the active site and can be outcompeted","denaturation - a permanent destruction, not a reversible block","allosteric site - where such inhibitors often bind"],["enz","types",1,"amylase","the enzyme that breaks starch down into maltose","it hydrolyses the glycosidic bonds between glucose units","starch stops giving a blue-black colour with iodine as it is digested","it is produced in the salivary glands and the pancreas","protease - breaks down protein instead","lipase - breaks down lipids instead","catalase - breaks down hydrogen peroxide"],["enz","types",1,"protease","the enzyme that breaks proteins down into amino acids","it hydrolyses the peptide bonds between amino acids","the products are small enough to be absorbed","it is produced in the stomach, pancreas and small intestine","amylase - acts on starch, not protein","lipase - acts on lipids, not protein","pepsin - a specific protease active in acid"],["enz","types",1,"lipase","the enzyme that breaks lipids down into fatty acids and glycerol","it hydrolyses the ester bonds in triglycerides","the products are absorbed in the small intestine","bile emulsifies fat first, which gives lipase more surface area","amylase - acts on starch","protease - acts on protein","bile - emulsifies but does not digest"],["enz","types",2,"catalase","the enzyme that breaks hydrogen peroxide into water and oxygen","it is one of the fastest enzymes known","it protects cells from oxidative damage by peroxide","it is abundant in liver and potato tissue, which is why those fizz","peroxidase - a different peroxide-handling enzyme","amylase - a digestive enzyme for starch","oxidase - adds oxygen rather than removing peroxide"],["enz","practical",1,"iodine test for starch","a test in which iodine turns blue-black in the presence of starch","the iodine molecules lodge inside the starch helix","a colour change shows starch is present; no change shows it has been digested","in an amylase experiment the colour fades as starch disappears","Benedict test - detects reducing sugars such as maltose","Biuret test - detects protein","limewater - detects carbon dioxide"],["enz","practical",1,"Benedict test","a test for reducing sugars","the blue copper sulphate is reduced to a brick-red precipitate on heating","a colour change from blue through green to brick red shows sugar is present","it detects the maltose produced when amylase digests starch","iodine test - detects starch, not sugar","Biuret test - detects protein","Millon test - an older protein test"],["enz","practical",1,"Biuret test","a test for protein","copper ions form a violet complex with peptide bonds","a purple colour indicates protein is present","it is used to show a protease has not yet finished digesting","iodine test - detects starch","Benedict test - detects reducing sugar","ninhydrin - detects amino acids specifically"],["enz","practical",2,"effect of boiling on enzymes","the consequence of heating an enzyme solution to 100 degrees","the heat energy breaks the hydrogen bonds holding the tertiary structure","the active site loses its shape and the enzyme is denatured","cooling it back down does not restore activity","effect of low temperature - slows but does not destroy","optimum temperature - the peak before destruction","inhibition - blocking without destroying the structure"],["enz","practical",2,"effect of low temperature on enzymes","the consequence of cooling an enzyme solution","molecular motion slows, so fewer collisions occur at the active site","the rate falls but the enzyme is not destroyed","activity returns when the temperature rises again","effect of boiling - irreversible denaturation","optimum temperature - the fastest working point","freezing - preserves enzymes rather than destroying them"],["enz","mechanism",2,"enzymes are proteins","the chemical nature of almost all enzymes","they are chains of amino acids folded into a precise three-dimensional shape","the shape creates the active site, which is why heat and pH matter","the exception is catalytic RNA, but school biology treats enzymes as proteins","amino acid - the monomer that builds the enzyme","substrate - the molecule acted upon","cofactor - a non-protein helper some enzymes require"],["enz","mechanism",2,"enzymes are reusable","the fact that an enzyme is not consumed by the reaction it catalyses","the products leave the active site and the enzyme is unchanged","one enzyme molecule can catalyse thousands of reactions per second","this is what makes a tiny amount of enzyme so effective","substrate - is consumed, unlike the enzyme","product - the output of each cycle","denaturation - the only thing that permanently removes activity"],["enz","industry",3,"immobilised enzymes","enzymes fixed to a solid support rather than free in solution","the substrate flows over the immobilised enzyme and product is collected","the enzyme can be recovered and reused, and does not contaminate the product","this is why lactose-free milk and glucose syrup are economic to make","free enzyme - dissolved and hard to recover","denaturation - still possible, but the support protects against it","catalyst - the general term for what it is"],["enz","industry",2,"enzyme use in industry","the commercial applications of enzymes","detergents use proteases and lipases to break down stains at low temperature","biological washing powders work below 40 degrees, saving energy","enzymes must match the pH and temperature of the process","catalyst - the general principle","denaturation - the reason high-temperature washes waste enzyme","immobilised enzyme - the form used in continuous processes"],["eval","variables",1,"independent variable","the variable the experimenter deliberately changes","it is set to different values across the trials","it is the cause you are testing for an effect","there is only ever one in a fair test","dependent variable - what is measured in response","control variable - what is kept the same","confounding variable - an uncontrolled factor that ruins validity"],["eval","variables",1,"dependent variable","the variable that is measured in response","it is what the independent variable is supposed to affect","it must be measured with a named instrument or test","it is plotted on the vertical axis","independent variable - what is deliberately changed","control variable - what is held constant","controlled variable - an alternative name for a control variable"],["eval","variables",1,"control variable","a factor kept the same across all trials","it is held constant so it cannot explain the result","without it, any difference could be due to the wrong cause","common ones are temperature, pH, volume, mass and time","independent variable - the one that is changed","control group - the comparison group without the treatment","confounding variable - a control variable that was missed"],["eval","variables",2,"control group","a group that receives no treatment or a placebo","it is treated identically in every other respect","it shows what would have happened without the independent variable","without it you cannot claim the treatment caused the change","experimental group - the group receiving the treatment","control variable - a factor held constant, not a group","placebo - the dummy treatment a control group may receive"],["eval","variables",2,"fair test","an experiment in which only the independent variable affects the result","all other relevant factors are held constant","it allows the effect to be attributed to the variable you changed","it is the practical expression of a valid experiment","reliability - repeatability, a different quality","validity - whether you measured the right thing","accuracy - how close a reading is to the true value"],["eval","quality",1,"reliability","the consistency of a measurement when repeated","repeating the experiment and getting similar values shows it","it can be improved by taking more readings and averaging","reliability says nothing about whether the answer is correct","validity - whether the method measures the right thing","accuracy - closeness to the true value","precision - the fineness of the scale"],["eval","quality",1,"validity","the extent to which an experiment measures what it claims to","it requires a fair test with all relevant variables controlled","a valid experiment supports a conclusion about the hypothesis","a reliable experiment can still be invalid","reliability - consistency, not correctness","accuracy - closeness to true value","precision - resolution of the instrument"],["eval","quality",2,"accuracy","how close a measurement is to the true value","it depends on calibration and on avoiding systematic error","accurate data can still be imprecise and vice versa","a balance not zeroed gives accurate-looking but wrong readings","precision - the smallest change an instrument can detect","reliability - repeatability across trials","validity - whether the right quantity was measured"],["eval","quality",2,"precision","how fine the scale of a measurement is","it is set by the resolution of the instrument","a more precise instrument gives more decimal places, not necessarily truth","repeated readings can be precise but biased","accuracy - closeness to the true value","resolution - the numerical size of one division","reliability - consistency of repeats"],["eval","quality",3,"resolution","the smallest change an instrument can measure","it equals the value of the smallest division on its scale","it sets the limit on precision and on the uncertainty","a ruler with 1 mm divisions has 1 mm resolution","precision - the quality that resolution produces","accuracy - unaffected by resolution alone","uncertainty - the range within which the true value lies"],["eval","error",2,"random error","variation in readings with no consistent direction","it comes from unpredictable fluctuations in conditions or technique","repeating and averaging reduces its effect","it affects precision more than accuracy","systematic error - a consistent offset in one direction","anomalous result - a single reading far from the rest","human error - a vague term that should be replaced by a specific cause"],["eval","error",2,"systematic error","a consistent error in one direction","it function gcap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function gshuf(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function gsplit(f){const i=f.indexOf(' - ');return i<0?[f,'a different structure in the same unit']:[f.slice(0,i),f.slice(i+3)]}
function gmcq(q,pairs,e){const sh=gshuf(pairs.slice());return {q:q,o:sh.map(p=>p.o),a:sh.findIndex(p=>p.c),e:e,bd:sh.map(p=>p.b)}}
GQ.forEach(function(a){
  const s=a[0],tag=a[1],d=a[2],term=a[3],short=a[4],mech=a[5],conseq=a[6],extra=a[7];
  const sub=SUBJECTS[s]; if(!sub)return;
  if(!sub.bank)sub.bank=[]; if(!sub.quiz)sub.quiz=[];
  const T=gcap(term), M=gcap(mech), E=gcap(extra);
  const ds=a.slice(8).map(gsplit), D0=gcap(ds[0][0]), D1=gcap(ds[1][0]), D2=gcap(ds[2][0]);

  /* 1 - definition */
  sub.bank.push({cmd:'Define',t:tag,d:d,q:'What is meant by \u201c'+term+'\u201d?',
    a:T+' is '+short+'. '+M+'. As a result, '+conseq+'. '+E+'.',tags:[tag],
    bd:{b12:gcap(ds[0][0])+' \u2014 that is what matches the description.',
      w12:'Incorrect. It names the wrong structure: '+ds[0][0]+' is '+ds[0][1]+'. An incorrect claim scores nothing.',
      b34:T+' is '+short+'.',

      w34:'It now explains how it works, but never says what the mechanism achieves, so every consequence mark is still on the table.',
      b56:T+' is '+short+'. '+M+'. As a result, '+conseq+'.',

  /* 2 - significance */
  sub.bank.push({cmd:'Explain',t:tag,d:Math.min(3,d+1),q:'Explain the significance of '+term+' for the organism.',
    a:T+' matters because '+conseq+'. '+M+', and '+E+'.',tags:[tag],
    bd:{b12:'It matters because it is really '+D0+' doing the work.',
      w12:'Incorrect \u2014 it assigns the wrong role: '+ds[0][0]+' is '+ds[0][1]+'. An incorrect claim scores nothing.',
      b34:T+' is '+short+'.',

      b56:T+' is '+short+', and '+mech+'. That matters because '+conseq+'.',

      b78:T+' is '+short+', and '+mech+'. That matters because '+conseq+'. And '+E+'.',
      w78:'It closes with the precise detail that shows understanding rather than recall.'}});

  /* 3 - spot the error */
  sub.bank.push({cmd:'Apply',t:tag,d:3,q:'A student writes: \u201c'+D0+' \u2014 '+short+'.\u201d Identify the error and explain the correct answer.',
    a:'The description is right but it is attached to the wrong term. '+short+' describes '+T+', not '+D0+'. '+D0+' is '+ds[0][1]+'. '+T+' is '+short+', and '+mech+', so '+conseq+'.',tags:[tag],
    bd:{b12:'The student is right \u2014 '+D0+' does match that description.',
      w12:'Incorrect \u2014 it endorses the mislabel: '+short+' describes '+T+', not '+D0+' ('+ds[0][1]+').',
      b34:'The description belongs to '+T+', not '+D0+'. '+D0+' is '+ds[0][1]+'.',
      w34:'It corrects the term and defines the wrong one \u2014 which is where most answers stop.',
      b56:'The description belongs to '+T+', not '+D0+'. '+D0+' is '+ds[0][1]+'. '+T+' is '+short+', and '+mech+'.',
      w56:'It justifies the correction with the mechanism, which is what actually distinguishes the two structures.',
      b78:'The description belongs to '+T+', not '+D0+'. '+D0+' is '+ds[0][1]+'. '+T+' is '+short+', and '+mech+', so '+conseq+'.',
      w78:'It closes with the consequence, so the answer explains the error instead of merely naming it.'}});

  /* quiz - term from description */
  sub.quiz.push(Object.assign(gmcq('Which term is described here? \u201c'+short+'\u201d',
    [{o:T,c:1,b:'Correct \u2014 '+T+' is '+short+'.'},
     {o:D0,c:0,b:'No \u2014 '+ds[0][0]+' is '+ds[0][1]+', not '+short+'.'},
     {o:D1,c:0,b:'No \u2014 '+ds[1][0]+' is '+ds[1][1]+', not '+short+'.'},

    {tags:[tag],d:d,s:s}));

  /* quiz - description from term */

    [{o:short,c:1,b:'Correct \u2014 this is the definition of '+T+'.'},

    {tags:[tag],d:d,s:s}));
});

function initLandingFx(){
  if(!('IntersectionObserver' in window))return;
  // scroll reveal
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));
  // counters
  const co=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting)return;co.unobserve(e.target);
    const t=+e.target.dataset.count;let n=0;const step=Math.max(1,Math.round(t/28));
    const id=setInterval(()=>{n=Math.min(t,n+step);e.target.textContent=n;if(n>=t)clearInterval(id)},28);
  }),{threshold:.4});
  document.querySelectorAll('[data-count]').forEach(el=>co.observe(el));
  // nav scroll state
  const nav=document.getElementById('site-nav');
  const onScroll=()=>nav.classList.toggle('scrolled',window.scrollY>30);
  window.removeEventListener('scroll',window.__lpScroll);window.__lpScroll=onScroll;window.addEventListener('scroll',onScroll);onScroll();
  // hero mock flip loop
  const mock=document.getElementById('hero-mock');
  if(mock){clearInterval(window.__lpFlip);let on=false;
    window.__lpFlip=setInterval(()=>{on=!on;mock.classList.toggle('flip',on)},2600);}
}

function answerDiag(pick){
  const q=diag.qs[diag.i];
  const corr=pick===q.a;
  diag.per[q.s].n++;
  if(corr){diag.per[q.s].ok++;diag.score++;}
  else diag.wrong.push({s:q.s,q:q.q,a:q.o[q.a],pick:q.o[pick],e:q.e||''});
  diag.i++;
  if(diag.i>=diag.qs.length){
    const per={};let weakest=null,wp=101;
    Object.keys(diag.per).forEach(k=>{const d=diag.per[k];per[k]=d.n?Math.round(100*d.ok/d.n):0;
      if(d.n&&per[k]<wp){wp=per[k];weakest=k}});
    if(!weakest)weakest=Object.keys(per)[0];
    diagResult={per,weakest,ts:Date.now(),missed:diag.wrong};
    DB.set('diag',diagResult);diag=null;

function exportDiagnostic(mode){
  if(!diagResult)return;
  const d=new Date(diagResult.ts);
  const date=d.toLocaleDateString()+' '+d.toLocaleTimeString();
  const names=Object.values(SUBJECTS).map(x=>[x.id,x.name]);
  const total=Object.values(diagResult.per).reduce((a,b)=>a+b,0);
  const avg=Math.round(total/Math.max(1,names.length));
  let out='G9 ISF Biology Revision - Diagnostic report\n';
  out+='Date: '+date+'\n\n';
  out+='Per-subject score\n';
  names.forEach(([id,n])=>{out+='  - '+n+': '+diagResult.per[id]+'%\n'});
  out+='\nAverage: '+avg+'%\n';
  out+='Weakest unit: '+S(diagResult.weakest).name+' ('+diagResult.per[diagResult.weakest]+'%)\n';
  if(diagResult.missed&&diagResult.missed.length){
    out+='\nMissed questions\n';
    diagResult.missed.forEach((m,i)=>{
      out+='\n'+(i+1)+'. ['+S(m.s).short+'] '+m.q+'\n';
      out+='   your answer: '+m.pick+'\n';
      out+='   correct:     '+m.a+'\n';
      if(m.e)out+='   why: '+m.e+'\n';
    });
  }else{
    out+='\nNo missed questions - clean run.\n';
  }
  if(mode==='copy'){
    const done=()=>{const b=document.getElementById('diag-copy-note');if(b)b.textContent='Copied to clipboard.'};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(out).then(done,()=>fallbackCopy(out,done))}
    else fallbackCopy(out,done);
    return;
  }
  const blob=new Blob([out],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='bulby-diagnostic-'+d.toISOString().slice(0,10)+'.txt';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function fallbackCopy(t,cb){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();if(cb)cb()}

let bankFilter={s:'all',cmd:'all',d:'all',sort:'subj',tag:'all'};
const BAND_DATA={};
function autoBands(a){
  if(!a)return null;
  const parts=String(a).split(/(?<=[.!?])\s+/).filter(x=>x&&x.trim());
  if(parts.length<3)return null;
  const full=parts.join(' ');
  const L=full.length;
  const joinUpTo=f=>{let s='',i=0;while(i<parts.length&&s.length<f*L){s=(s?s+' ':'')+parts[i];i++}return s};
  const b78=full;
  const b56=joinUpTo(0.55);
  const b34=joinUpTo(0.28);
  return {b12:'It depends on the situation \u2014 sometimes true, sometimes not, so it cannot be judged.',
    w12:'It dodges the question: no position, no biology. An incorrect or empty claim scores nothing, so this sits at the bottom of the range.',
    b34:b34,
    w34:'It takes a clear position and states the key fact \u2014 correct, but with no development yet.',
    b56:b56,
    w56:'The reasoning is developing, but the evidence and the qualification the higher bands need are still missing.',
    b78:b78,
    w78:'The final sentence is what earns the top band: it weighs the evidence instead of only presenting it.'};
}

    (!bankFilter.tag||bankFilter.tag==='all'||(b.tags||[]).includes(bankFilter.tag)));

  const order={subj:0};
  if(bankFilter.sort==='subj')l.sort((a,b)=>Object.keys(SUBJECTS).indexOf(a.s)-Object.keys(SUBJECTS).indexOf(b.s));
  if(bankFilter.sort==='cmd')l.sort((a,b)=>cmds.indexOf(a.cmd)-cmds.indexOf(b.cmd));
  if(bankFilter.sort==='d')l.sort((a,b)=>(b.d||1)-(a.d||1));
  return l;
}
let bankShown=40;
function renderBank(){bankShown=40;drawBank()}
function drawBank(){
  const el=document.getElementById('page-bank');
  const cmds=[...new Set(ALL_BK.map(b=>b.cmd))];
  const tags=[...new Set(ALL_BK.flatMap(b=>b.tags||[]))].sort();
  const cOpts=cmds.map(c=>`<option value="${c}">${c}</option>`).join('');
  const tOpts=tags.map(t=>`<option value="${t}">${t}</option>`).join('');
  const chips=[['all','All'],['1','\u2605'],['2','\u2605\u2605'],['3','\u2605\u2605\u2605']].map(([v,t])=>`<button class="chip ${bankFilter.d===v?'on':''}" onclick="bankFilter.d='${v}';renderBank()">${t}</button>`).join('');
  const sChips=[['all','All subjects']].concat(Object.values(SUBJECTS).map(s=>[s.id,s.short])).map(([v,t])=>`<button class="chip ${bankFilter.s===v?'on':''}" onclick="bankFilter.s='${v}';renderBank()">${t}</button>`).join('');
  const list=bankList();
  const qs=list.slice(0,bankShown).map((b)=>{
    const idx=ALL_BK.indexOf(b);
    const s=S(b.s);
    const done=!!bankDone[idx];
    const bands=b.bd||BAND_DATA[idx]||autoBands(b.a);
    const tagHtml=(b.tags||[]).map(t=>`<span class="t">${esc(t)}</span>`).join('');
    const bodyHtml = bands
      ? `<div class="band b1"><div class="band-h"><i data-lucide="circle-dot"></i>Band 1\u20132 \u2014 what this answer looks like</div><div class="band-b">${esc(bands.b12)}<div class="why"><b>Why it stops here:</b> ${esc(bands.w12)}</div></div></div>
         <div class="band b2"><div class="band-h"><i data-lucide="circle-dot"></i>Band 3\u20134 \u2014 the standard to hit</div><div class="band-b">${esc(bands.b34)}<div class="why"><b>Why this beats 1\u20132:</b> ${esc(bands.w34)}</div></div></div>
         <div class="band b3"><div class="band-h"><i data-lucide="circle-dot"></i>Band 5\u20136 \u2014 top of the school range</div><div class="band-b">${esc(bands.b56)}<div class="why"><b>Why this beats 3\u20134:</b> ${esc(bands.w56)}</div></div></div>
         <div class="band b4"><div class="band-h"><i data-lucide="circle-dot"></i>Band 7\u20138 \u2014 full marks</div><div class="band-b">${esc(bands.b78)}<div class="why"><b>The full-marks differentiator:</b> ${esc(bands.w78)}</div></div></div>`
      : `<div class="band b4"><div class="band-h"><i data-lucide="circle-dot"></i>Model answer (full marks)</div><div class="band-b">${esc(b.a)}</div></div>`;
    return `<div class="bq">
      <div class="bq-head" onclick="this.parentNode.classList.toggle('open');this.querySelector('.arrow').textContent=this.parentNode.classList.contains('open')?'\u25bc':'\u25b6'">
        <button class="mark ${done?'done':''}" onclick="event.stopPropagation();toggleBank(${idx},this)">\u2713</button>
        <span class="tag ${b.s==='cardi'?'cardi':b.s}" style="background:${s.color}">${esc(s.short)}</span>
        <span class="qt">${esc(b.q)}</span>
        <div class="qtags"><span class="t">${esc(b.cmd)}</span>${tagHtml}<span class="dchip">${'\u2605'.repeat(b.d||1)}</span></div>
        <span class="arrow">\u25b6</span>
      </div>
      <div class="bq-body">${bodyHtml}</div>
    </div>`}).join('');
  el.innerHTML=`<h2>Question Bank</h2>
  <p class="muted">${ALL_BK.length} exam-style questions \u00b7 every answer is broken into the four IB bands with the reason each band lands where it does. Reveal <i>after</i> you\u2019ve answered out loud or on paper.</p>
  <div class="bank-tools no-print">
    <div class="chips" style="margin:0">${sChips}</div>
    <div class="chips" style="margin:0">${chips}</div>
    <label class="muted">command:</label><select onchange="bankFilter.cmd=this.value;renderBank()"><option value="all">All</option>${cOpts}</select>
    <label class="muted">tag:</label><select onchange="bankFilter.tag=this.value;renderBank()"><option value="all">All</option>${tOpts}</select>
    <label class="muted">sort:</label><select onchange="bankFilter.sort=this.value;renderBank()"><option value="subj">By subject</option><option value="cmd">By command term</option><option value="d">By difficulty</option></select>
    <span class="muted" style="margin-left:auto">${list.length} shown</span>
  </div>
  ${qs||'<div class="empty">No questions match those filters.</div>'}${list.length>bankShown?`<button class="btn" style="width:100%;margin-top:14px;font-family:var(--fh);font-size:1.05em" onclick="bankShown+=60;drawBank()">Show more \u2014 ${list.length-bankShown} more of ${list.length}</button>`:''}`;
}
function toggleBank(i,btn){bankDone[i]=!bankDone[i];if(!bankDone[i])delete bankDone[i];DB.set('bankDone',bankDone);btn.classList.toggle('done',!!bankDone[i])}

  const el=document.getElementById('page-progress');
  const totalK=ALL_FC.filter(c=>known[c.s+'|'+c.q]).length;
  const totalB=Object.keys(bankDone).length;
  const quizTaken=Object.keys(quizBest).length;
  const diagTxt=diagResult==='skip'?'skipped':(diagResult?`${diagResult.per[diagResult.weakest]}% weakest — ${esc(S(diagResult.weakest).short)}`:'not done');
  const rows=Object.values(SUBJECTS).map(s=>{
    const k=ALL_FC.filter(c=>c.s===s.id&&known[s.id+'|'+c.q]).length;

    const bd=s.bk.filter((b,i)=>bankDone[ALL_BK.indexOf(b)]).length;

      <td><div class="prog" style="margin:0"><i style="width:${pct}%"></i></div></td>
      <td>${k}/${s.fc.length}</td>
      <td>${quizBest[s.id]!=null?quizBest[s.id]+'%':'—'}</td>
      <td>${bd}/${s.bk.length}</td></tr>`}).join('');
  el.innerHTML=`<h2>Progress</h2><p class="muted">Saved in this browser only. Reset below if you want a clean slate.</p>
  <div class="stat-row">
    <div class="stat"><div class="v">${totalK}/${ALL_FC.length}</div><div class="l">flashcards known</div></div>
    <div class="stat"><div class="v">${quizTaken}/6</div><div class="l">units quizzed</div></div>
    <div class="stat"><div class="v">${totalB}/${ALL_BK.length}</div><div class="l">bank questions attempted</div></div>
    <div class="stat"><div class="v" style="font-size:15px;line-height:1.3">${diagTxt}</div><div class="l">diagnostic status</div></div>
  </div>
  <div class="card"><table><tr><th>Subject</th><th>Cards</th><th>Known</th><th>Best quiz</th><th>Bank</th></tr>${rows}</table></div>

  ${(diagResult&&diagResult!=='skip')?`<div class="card" style="margin-top:12px"><b>Diagnostic</b> <span class="muted">${diagResult.ts?new Date(diagResult.ts).toLocaleString():''}</span>
    <table style="margin-top:8px"><tr><th>Subject</th><th></th><th>%</th></tr>${Object.values(SUBJECTS).map(x=>{
      const p=diagResult.per[x.id];
      const col=p>=80?'var(--good)':p>=50?'var(--warn)':'var(--bad)';
      return `<tr><td>${x.icon} ${esc(x.short)}</td><td><div class="prog" style="margin:0"><i style="width:${p}%;background:${col}"></i></div></td><td style="width:60px"><b>${p}%</b></td></tr>`;}).join('')}</table>
    <div class="no-print" style="margin-top:8px"><button class="btn sm pri" onclick="viewDiag()">View full results</button> <button class="btn sm" onclick="exportDiagnostic('download')">Export report (.txt)</button> <button class="btn sm" onclick="exportDiagnostic('copy')">Copy summary</button></div></div>`
  :`<div class="card" style="margin-top:12px"><b>Diagnostic</b><p class="muted">${diagResult==='skip'?'You skipped it \u2014 it takes five minutes and unlocks your personalised path.':'Not done yet \u2014 twelve questions, two per subject, tells you exactly where you stand.'}</p><div class="no-print"><button class="btn sm pri" onclick="runDiagnostic()">Start the diagnostic</button></div></div>`}
  <div class="card" style="margin-top:12px"><b>Score history</b>
  ${(scoreLog&&scoreLog.length)?`<table><tr><th>Date</th><th>Quiz</th><th>Level</th><th>Score</th><th>%</th></tr>${scoreLog.slice(0,10).map(r=>{
    const d=new Date(r.ts);
    const nm=r.s==='mix'?'Mixed':esc(S(r.s).short);
    const dd=(r.d&&r.d!=='all')?'\u2605'.repeat(+r.d):'any';
    return `<tr><td>${d.toLocaleDateString()} ${d.toLocaleTimeString().slice(0,5)}</td><td>${nm}</td><td>${dd}</td><td>${r.score}/${r.n}</td><td><b>${r.pct}%</b></td></tr>`;}).join('')}</table>
  <div class="no-print" style="margin-top:8px"><button class="btn sm" onclick="scoreLog=[];DB.set('scoreLog',[]);renderProgress()">Clear history</button></div>`
  :'<p class="muted">No quizzes finished yet \u2014 every quiz you complete is logged here with its date, scope and score.</p>'}</div>
  <div class="no-print" style="margin-top:12px"><button class="btn" onclick="if(confirm('Reset ALL progress?')){known={};quizBest={};bankDone={};diagResult=null;scoreLog=[];DB.set('known',{});DB.set('quizBest',{});DB.set('bankDone',{});DB.set('diag',null);DB.set('scoreLog',[]);renderProgress();renderHome()}">Reset all progress</button></div>`;
}

/* ============ EXTRAS ============ */
function renderExtras(){
  const el=document.getElementById('page-extras');
  el.innerHTML=`
  <h2>Extras</h2>
  <p class="muted">The detail that doesn\\'t fit the main notes — corrections to circulating charts, deeper extensions, and how to use the bands.</p>

  <div class="x-card">
    <h3><i data-lucide="alert-triangle" style="color:#d97706"></i>Two errors to check against your own charts</h3>
    <p><b>1. The "full blood path" chart.</b> Two slides of the cardiovascular material print <i>"Right ventricle → Pulmonary <b>Vein</b> → Lungs"</i>. The right ventricle sends deoxygenated blood to the lungs through the pulmonary <b>artery</b>; the pulmonary <b>vein</b> is the return leg (lungs → left atrium, oxygenated). One slide of the same chart has it right — if your copy disagrees with itself, this is why. The exam will test exactly this: two vessels whose names argue with their oxygen content.</p>
    <p><b>2. "CO₂ is a by-product in both modes of respiration."</b> True for <b>yeast</b> fermentation (ethanol + CO₂) and for aerobic respiration. <b>False for animals</b> — lactic-acid fermentation produces lactate and no CO₂. If an exam question is about human muscle, the product is lactate and CO₂ is absent.</p>
    <p class="muted">Both are flagged here rather than in the main notes so your revision copy stays clean — but know they exist before the exam.</p>
  </div>

  <div class="x-card">
    <h3><i data-lucide="flask-conical" style="color:#6d28d9"></i>Extensions beyond the core</h3>
    <ul>
      <li><b>Enzyme inhibition.</b> Competitive inhibitors occupy the active site with a substrate-shaped molecule — overcome by adding more substrate. Non-competitive inhibitors bind elsewhere and distort the active site — <i>not</i> overcome by more substrate. Both reduce Vmax-like rates by the same "occupied sites" logic as high substrate competition.</li>
      <li><b>Q₁₀ and rate ratios.</b> For enzyme-controlled reactions, rate typically roughly doubles per 10 °C rise — until the optimum, where denaturation reverses the trend. If a practical gives you times, convert to <i>1/time</i> before graphing; raw time graphs are inverted and easy to misread.</li>
      <li><b>Denaturation is usually irreversible.</b> Cooling an enzyme only slows it (fewer collisions); boiling breaks the bonds that hold the active-site shape permanently. That asymmetry is a classic 2-mark question.</li>
      <li><b>Transpiration stream mechanics.</b> Evaporation from the leaf → tension on the water column → cohesion between water molecules and adhesion to xylem walls pull the whole column up. Lignin stops the tubes collapsing under that tension. Plants have no pump; the sun does the work.</li>
      <li><b>Oxygen dissociation (extension only).</b> Haemoglobin picks up O₂ readily at high partial pressure (lungs) and releases it where partial pressure is low and CO₂ is high (respiring muscle) — the Bohr effect. Useful for explaining why exercising muscle gets O₂ even though blood arrives oxygenated.</li>
    </ul>
  </div>

  <div class="x-card">
    <h3><i data-lucide="bar-chart-3" style="color:#475569"></i>Extra data-evaluation practice</h3>
    <p>Four more skeletons to run the five-part recipe on (trend → supports with data → contradicts with data → limitations → qualified verdict):</p>
    <ul>
      <li>Amylase clearance times at 20/30/40/50/60 °C with a peak at 40 °C and no reaction at 60 °C.</li>
      <li>Pondweed bubble counts at 10/20/40/80 cm from the lamp.</li>
      <li>Pulse rates 72 → 98 → 120 → 128 → 128 → 130 bpm over five minutes of running.</li>
      <li>Transpiration rates at 30/50/70/90 % humidity with overlapping error bars.</li>
    </ul>
    <p class="muted">Full banded model answers for all four are in the Question Bank under the tag <b>data-evaluation</b>.</p>
  </div>

  <div class="x-card">
    <h3><i data-lucide="graduation-cap" style="color:#4f46e5"></i>How to use the banded answers</h3>
    <ol>
      <li>Answer first, out loud or on paper. Reading the model answer first flatters you and teaches you nothing.</li>
      <li>Read <b>Band 1–2</b> honestly — if your answer matched it, note the missing ingredient.</li>
      <li>Read the <b>"Why this beats…"</b> notes — they name the exact move that buys each band. That move is the study target, not the wording.</li>
      <li>Band 7–8 answers are not longer for the sake of it: they add the <i>qualification</i>, the <i>specific data</i>, or the <i>mechanism link</i> the lower bands skip.</li>
    </ol>
  </div>`;
  lucideRefresh();
}
