<!DOCTYPE html>
<html lang="en" data-page-node-id="8J4igUM08ueAjA8ETuVM0W">
<head data-page-node-id="zV35YZSD0tkAdjvXHivqPt">
<meta charset="UTF-8" data-page-node-id="fdpZd5g0lDz2lskqvc4YDw">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="ORx3oFRpmk5toZ3JBbEKGI">
<title>G9 ISF Biology Revision</title>
<style>
:root{
  --ink:#17203a; --muted:#5b6478; --line:#dde3ee; --bg:#f4f6fb; --panel:#ffffff;
  --accent:#2563eb; --accent-soft:#eef4ff;
  --good:#15803d; --good-bg:#ecfdf3; --bad:#b42318; --bad-bg:#fef3f2;
  --warn:#b45309; --warn-bg:#fffaeb; --warn-line:#fedf89;
  --resp:#0369a1; --cardio:#be1239; --plant:#15803d; --photo:#b45309; --enz:#6d28d9; --eval:#475569;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:16px;height:54px}
.logo{font-weight:800;font-size:16px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main button{appearance:none;border:0;background:none;font:inherit;font-weight:600;font-size:13.5px;color:var(--muted);padding:7px 11px;border-radius:8px;cursor:pointer}
nav.main button:hover{background:var(--bg)}
nav.main button.on{background:var(--accent-soft);color:var(--accent)}
.searchbox{margin-left:8px;position:relative}
.searchbox input{border:1px solid var(--line);border-radius:8px;padding:7px 10px 7px 28px;font:inherit;font-size:13px;width:170px;background:#fff}
.searchbox svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);opacity:.45}
main{padding:26px 0 70px}
section.page{display:none}
section.page.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
h1{font-size:26px;letter-spacing:-.02em}
h2{font-size:20px;letter-spacing:-.01em;margin:0 0 4px}
h3{font-size:16px;margin:22px 0 8px}
p{margin:6px 0}
ul,ol{margin:6px 0 10px 20px}
li{margin:3px 0}
.muted{color:var(--muted);font-size:13px}
.hero{background:linear-gradient(135deg,#1e3a8a,#4c1d95);color:#fff;border-radius:18px;padding:30px 28px;margin-bottom:18px}
.hero h1{color:#fff}
.hero p{color:#cbd5e1;max-width:70ch;margin-top:8px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;font-size:13.5px;border-radius:9px;padding:9px 14px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(.93)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:600px){.g3{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.subj-card{cursor:pointer;transition:transform .12s, box-shadow .12s;position:relative;overflow:hidden}
.subj-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(23,32,58,.08)}
.subj-card .bar{position:absolute;top:0;left:0;right:0;height:4px}
.subj-card h3{margin:6px 0 2px;font-size:15.5px}
.subj-card .counts{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.prog{height:7px;background:var(--bg);border-radius:20px;overflow:hidden;margin-top:10px}
.prog>i{display:block;height:100%;border-radius:20px;background:var(--good)}
.callout{border-radius:var(--r);padding:11px 14px;margin:10px 0;font-size:14px}
.callout.warn{background:var(--warn-bg);border:1px solid var(--warn-line)}
.callout.tip{background:var(--accent-soft);border:1px solid #c7dbfe}
.callout.bad{background:var(--bad-bg);border:1px solid #fca5a5}
.callout.good{background:var(--good-bg);border:1px solid #bbf7d0}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px;background:#fff}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:700}
.eq{font-family:var(--mono);background:#0f172a;color:#e2e8f0;border-radius:8px;padding:10px 14px;margin:8px 0;font-size:13.5px;overflow-x:auto}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;color:#fff}
.tag.resp{background:var(--resp)}.tag.cardi{background:var(--cardio)}.tag.plant{background:var(--plant)}
.tag.photo{background:var(--photo)}.tag.enz{background:var(--enz)}.tag.eval{background:var(--eval)}
.cmdtag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#eef2f7;color:#475569;margin-right:6px}
.stars{color:#d97706;letter-spacing:1px;font-size:12px}
/* study */
.study-layout{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.study-layout{grid-template-columns:1fr}}
.side{position:sticky;top:70px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.side button{display:flex;width:100%;text-align:left;appearance:none;border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer;gap:8px;align-items:center}
.side button:hover{background:var(--bg)}
.side button.on{background:var(--accent-soft);color:var(--accent)}
.side .sw{width:9px;height:9px;border-radius:3px;flex:none}
.note-block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.note-block h2{display:flex;align-items:center;gap:8px}
.note-block h4{margin:16px 0 4px;font-size:14px}
svg text{font-family:inherit}
.figcap{font-size:12.5px;color:var(--muted);text-align:center;margin:2px 0 10px}
/* flashcards */
.fc-wrap{max-width:760px;margin:0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{appearance:none;border:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);border-radius:20px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip .n{opacity:.6;font-weight:500}
.fc-stage{perspective:1200px;margin:14px 0}
.fc{position:relative;width:100%;height:340px;max-height:72vh;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;overflow:auto;background:#fff}
.fc-back{background:var(--accent-soft);transform:rotateY(180deg);font-size:14.5px}
.fc-subj{position:absolute;top:10px;left:12px}
.fc-hint{position:absolute;bottom:10px;right:14px;font-size:11px;color:var(--muted)}
.fc-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
/* quiz */
.q{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0;background:#fff}
.q .opts{list-style:none;margin:10px 0 0}
.q .opts li{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer;font-size:14px}.opts.ro{pointer-events:none}.opts.ro li{cursor:default}
.q .opts li:hover{background:var(--bg)}
.q .opts li.right{background:var(--good-bg);border-color:#86efac;font-weight:600}
.q .opts li.wrong{background:var(--bad-bg);border-color:#fca5a5}
.q .opts li.dim{opacity:.55}
.q .exp{display:none;margin-top:10px;font-size:13.5px;background:var(--bg);border-left:3px solid var(--accent);padding:9px 12px;border-radius:0 8px 8px 0}
.bdlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.bdlist li{padding:8px 12px;border-radius:10px;font-size:13.5px;background:var(--paper2);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;text-align:left}
.bdlist li.right{border-color:var(--good);background:rgba(34,197,94,.08)}
.bdlist li.wrong{border-color:var(--bad);background:rgba(239,68,68,.08)}
.bdlist li.dim{opacity:.75}
.bdlist .bdwhy{color:var(--muted);font-size:12.5px}
.q .exp.show{display:block}
.quiz-setup{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.quiz-setup .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:8px 0}
.scorebar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:12px}
.scorebar .big{font-size:22px;font-weight:800}
select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;background:#fff}
/* bank */
.bank-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.bq{border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden;background:#fff}
.bq-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.bq-head .mark{appearance:none;border:1px solid var(--line);background:#fff;width:22px;height:22px;border-radius:6px;cursor:pointer;flex:none;font-size:13px;color:transparent;line-height:1}
.bq-head .mark.done{background:var(--good);border-color:var(--good);color:#fff}
.bq-head .qt{font-weight:600;flex:1;font-size:14px}
.bq-body{display:none;padding:2px 14px 14px;font-size:14px;background:var(--bg)}
.bq.open .bq-body{display:block}
.arrow{transition:transform .15s;color:var(--muted)}
.bq.open .arrow{transform:rotate(90deg)}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* search results */
.sr{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:12px 14px;margin:8px 0;cursor:pointer}
.sr:hover{background:var(--bg)}
.sr .sq{font-weight:600;font-size:14px}
.sr .sa{font-size:13px;color:var(--muted);margin-top:2px}
/* progress */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
@media(max-width:700px){.stat-row{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:18px 0 30px;color:var(--muted);font-size:12.5px}
@media print{
  header,.side,.no-print,.fc-hint{display:none!important}
  section.page{display:block!important;page-break-after:always}
  .bq-body{display:block!important} .eq,.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:12px} .study-layout{grid-template-columns:1fr}
}
/* ================= DESIGN SYSTEM v2 ================= */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{
  --accent:#4f46e5; --accent2:#7c3aed; --accent-soft:#eef2ff;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:16px; --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  --shadow-lg:0 24px 48px -12px rgba(15,23,42,.18);
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo{font-family:'Space Grotesk','Inter',sans-serif}
i[data-lucide]{display:inline-flex;vertical-align:-.2em;width:1em;height:1em}
/* view switching */
#landing{display:none}
body:not(.app) #landing{display:block}
body:not(.app) #app-nav,body:not(.app) #app-main{display:none!important}
body.app #site-nav,body.app #site-footer{display:none!important}

/* ---------- site nav ---------- */
#site-nav{position:fixed;top:0;left:0;right:0;z-index:60;transition:all .3s}
#site-nav .inner{max-width:1120px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:28px}
#site-nav .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:16px;color:#fff;text-decoration:none}
#site-nav .brand .glyph{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.5)}
#site-nav .links{display:flex;gap:4px;margin-left:auto}
#site-nav .links a{color:rgba(255,255,255,.75);text-decoration:none;font-size:13.5px;font-weight:500;padding:8px 12px;border-radius:8px;transition:.2s}
#site-nav .links a:hover{color:#fff;background:rgba(255,255,255,.1)}
#site-nav .launch{background:#fff;color:#4338ca;border:0;font:600 13.5px 'Inter';padding:9px 16px;border-radius:10px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);transition:.2s;display:flex;align-items:center;gap:7px}
#site-nav .launch:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
#site-nav.scrolled{background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#site-nav.scrolled .brand{color:var(--ink)}
#site-nav.scrolled .links a{color:var(--muted)}
#site-nav.scrolled .links a:hover{color:var(--ink);background:var(--soft)}
#site-nav.scrolled .launch{background:var(--accent);color:#fff}
@media(max-width:820px){#site-nav .links{display:none}}

/* ---------- landing ---------- */
.lp{overflow-x:hidden;background:#fff}
.lp-hero{position:relative;background:linear-gradient(135deg,#312e81 0%,#4f46e5 45%,#7c3aed 100%);color:#fff;padding:150px 20px 90px;isolation:isolate}
.lp-hero .aurora{position:absolute;inset:0;z-index:-1;overflow:hidden}
.lp-hero .aurora span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
.lp-hero .aurora span:nth-child(1){width:480px;height:480px;background:#6366f1;top:-160px;left:-120px}
.lp-hero .aurora span:nth-child(2){width:420px;height:420px;background:#a855f7;bottom:-180px;right:-100px;animation-delay:-4s}
.lp-hero .aurora span:nth-child(3){width:300px;height:300px;background:#38bdf8;top:30%;right:24%;animation-delay:-8s;opacity:.35}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,40px) scale(1.15)}}
.lp-hero .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;max-width:1120px;margin:0 auto}
@media(max-width:960px){.lp-hero .grid{grid-template-columns:1fr}.lp-hero{padding-top:120px}}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:7px 14px;border-radius:100px;font-size:12.5px;font-weight:600;letter-spacing:.02em;backdrop-filter:blur(6px)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 12px #4ade80;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.lp-hero h1{font-size:clamp(38px,5.2vw,62px);line-height:1.04;letter-spacing:-.03em;margin:20px 0 18px;color:#fff}
.lp-hero h1 .grad{background:linear-gradient(90deg,#a5b4fc,#f0abfc,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.lp-hero p.lead{font-size:17px;line-height:1.65;color:rgba(255,255,255,.78);max-width:56ch}
.lp-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.btn-xl{display:inline-flex;align-items:center;gap:9px;font:600 15px 'Inter';padding:14px 24px;border-radius:13px;border:0;cursor:pointer;transition:.22s;text-decoration:none}
.btn-xl.pri{background:#fff;color:#4338ca;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.btn-xl.pri:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,.3)}
.btn-xl.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-xl.ghost:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.hero-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:26px;backdrop-filter:blur(16px);box-shadow:var(--shadow-lg);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.hero-card .mock{background:#fff;border-radius:14px;padding:22px;color:var(--ink);min-height:170px;display:flex;flex-direction:column;justify-content:center;box-shadow:inset 0 0 0 1px var(--line)}
.hero-card .mock .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hero-card .mock .qq{font-size:17px;font-weight:600;line-height:1.4}
.hero-card .mock .aa{font-size:13.5px;color:var(--muted);margin-top:12px;max-height:0;overflow:hidden;transition:max-height .5s ease,opacity .4s;opacity:0}
.hero-card .mock.flip .aa{max-height:120px;opacity:1}
.hero-card .mock.flip .qq{font-size:14px;color:var(--muted);font-weight:500}
.hero-meta{display:flex;justify-content:space-between;margin-top:14px;font-size:12px;color:rgba(255,255,255,.65)}
/* stats strip */
.lp-stats{border-bottom:1px solid var(--line);background:#fff}
.lp-stats .inner{max-width:1120px;margin:0 auto;padding:34px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;text-align:center}
@media(max-width:720px){.lp-stats .inner{grid-template-columns:repeat(2,1fr)}}
.lp-stats .v{font-family:'Space Grotesk';font-size:34px;font-weight:700;letter-spacing:-.02em;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lp-stats .l{font-size:13px;color:var(--muted);margin-top:2px}
/* section scaffolding */
.lp-sec{padding:84px 20px}
.lp-sec .head{max-width:640px;margin:0 auto 46px;text-align:center}
.lp-sec .eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.lp-sec h2{font-size:clamp(28px,3.6vw,40px);letter-spacing:-.02em;margin:10px 0 12px;color:var(--ink)}
.lp-sec .sub{color:var(--muted);font-size:15.5px;line-height:1.6}
.lp-sec.alt{background:var(--soft)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1120px;margin:0 auto}
@media(max-width:900px){.steps{grid-template-columns:1fr}}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:54px 26px 26px;position:relative;transition:.25s;box-shadow:var(--shadow)}
.step:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:#c7d2fe}
.step .n{position:absolute;top:12px;left:12px;width:30px;height:30px;border-radius:9px;transform:rotate(-4deg);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:0 6px 16px rgba(79,70,229,.4)}
.step .ico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:16px}
.step h3{font-size:17px;margin-bottom:8px;color:var(--ink)}
.step p{color:var(--muted);font-size:14px;line-height:1.6}
/* features */
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1120px;margin:0 auto}
@media(max-width:900px){.feats{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.feats{grid-template-columns:1fr}}
.feat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;transition:.25s}
.feat:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#c7d2fe}
.feat .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:14px;color:#fff}
.feat h3{font-size:15.5px;margin-bottom:6px;color:var(--ink)}
.feat p{color:var(--muted);font-size:13.5px;line-height:1.6}
/* subjects */
.subj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1120px;margin:0 auto}
@media(max-width:900px){.subj-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.subj-grid{grid-template-columns:1fr}}
.subj-tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;cursor:pointer;transition:.25s;position:relative;overflow:hidden;text-align:left}
.subj-tile::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.subj-tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.subj-tile .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;margin-bottom:14px;transition:.3s}
.subj-tile:hover .ico{transform:scale(1.1) rotate(-4deg)}
.subj-tile h3{font-size:16px;margin-bottom:6px;color:var(--ink)}
.subj-tile p{color:var(--muted);font-size:13px;line-height:1.55;min-height:42px}
.subj-tile .meta{display:flex;gap:12px;margin-top:14px;font-size:12px;color:var(--muted);font-weight:600}
.subj-tile .meta span{display:flex;align-items:center;gap:5px}
/* faq */
.faq{max-width:720px;margin:0 auto}
.faq details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:.2s}
.faq details[open]{border-color:#c7d2fe;box-shadow:var(--shadow)}
.faq summary{cursor:pointer;list-style:none;padding:18px 22px;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:12px;color:var(--ink)}
.faq summary::-webkit-details-marker{display:none}
.faq summary .chev{margin-left:auto;color:var(--muted);transition:.25s}
.faq details[open] summary .chev{transform:rotate(180deg)}
.faq .ans{padding:0 22px 18px;color:var(--muted);font-size:14px;line-height:1.65}
/* cta band */
.lp-cta-band{background:linear-gradient(135deg,#312e81,#4f46e5 50%,#7c3aed);border-radius:26px;padding:56px 40px;text-align:center;color:#fff;max-width:1000px;margin:0 auto;position:relative;overflow:hidden}
.lp-cta-band::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,.08);top:-200px;right:-100px}
.lp-cta-band h2{font-size:clamp(26px,3.4vw,38px);letter-spacing:-.02em;color:#fff}
.lp-cta-band p{color:rgba(255,255,255,.75);margin:12px auto 26px;max-width:52ch}
/* footer */
#site-footer{padding:44px 20px 36px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
#site-footer .inner{max-width:1120px;margin:0 auto;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
#site-footer .brand{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk';font-weight:700;color:var(--ink);font-size:14.5px}
#site-footer .brand .glyph{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center;color:#fff}
/* reveal animation */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}.rv.d4{transition-delay:.32s}.rv.d5{transition-delay:.4s}
@media print{#landing{display:none!important}}

/* ---- banded model answers ---- */
.band{border-radius:12px;margin:8px 0;overflow:hidden;border:1px solid var(--line);background:#fff}
.band-h{display:flex;align-items:center;gap:10px;padding:9px 14px;font-weight:700;font-size:13px;color:#fff}
.band-b{padding:12px 14px;font-size:13.5px;line-height:1.6}
.band-b .why{margin-top:8px;font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--soft);color:var(--muted)}
.band-b .why b{color:var(--ink)}
.b1 .band-h{background:#ef4444}.b2 .band-h{background:#f59e0b}.b3 .band-h{background:#3b82f6}.b4 .band-h{background:#linear-gradient(90deg,#059669,#10b981)}
.b4 .band-h{background:#059669}
.b1{border-color:#fecaca}.b2{border-color:#fde68a}.b3{border-color:#bfdbfe}.b4{border-color:#a7f3d0}
.qtags{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.qtags .t{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#eef2f7;color:#475569}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0 6px}
.dchip{font-size:11px;font-weight:700;color:#b45309;letter-spacing:1px}
.bank-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bq .bq-head{flex-wrap:wrap}
/* extras */
.x-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:12px 0}
.x-card h3{margin:0 0 8px;display:flex;gap:8px;align-items:center}

/* ================= PENCIL-ON-PAPER DESIGN SYSTEM ================= */

:root{
  --paper:#fbfaf4; --paper2:#f5f3ea; --card:#fffdf7;
  --ink:#2e2e2a; --pencil:#5d5d56; --line-p:#cfcabb; --line-p2:#e6e2d4;
  --accent:#3b5bdb; --accent-soft:#eef1fb; --pen:#c92a2a; --hl:rgba(255,232,130,.5);
  --shadow-p:2px 3px 0 rgba(46,46,42,.08);
  --r-hand:255px 15px 225px 15px/15px 225px 15px 255px;
  --r-hand2:15px 225px 15px 255px/225px 15px 255px 15px;
}
body{background:var(--paper);color:var(--ink);font-family:'Gaegu',cursive;font-size:17px;line-height:1.5}
h1,h2,h3,.logo,.v,.brand,.lbl{font-family:'Caveat',cursive}
b,strong{font-weight:700}
::selection{background:var(--hl)}

/* paper texture + ruled lines on the whole page */
.lp, #app-main, #site-footer{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(46,46,42,.045) 31px,rgba(46,46,42,.045) 32px)}
.lp-hero,#app-main .hero{background-image:
  repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(46,46,42,.06) 31px,rgba(46,46,42,.06) 32px),
  linear-gradient(135deg,#fdfcf7,#f7f5ec)}

/* hand-drawn border mixin (applied via classes below) */
.sketch{background:var(--card);border:1.6px solid var(--ink);border-radius:var(--r-hand);box-shadow:var(--shadow-p)}
.sketch2{border:1.6px solid var(--ink);border-radius:var(--r-hand2);box-shadow:var(--shadow-p)}

/* SITE NAV — plain, minimal */
#site-nav{background:rgba(251,250,244,.9);backdrop-filter:blur(8px)}
#site-nav .inner{border-bottom:1.5px solid transparent}
#site-nav .brand{color:var(--ink);font-size:21px;font-weight:700}
#site-nav .brand .glyph{background:none;box-shadow:none;color:var(--accent);width:auto;height:auto}
#site-nav .links a{color:var(--pencil);font-family:'Gaegu';font-size:16px}
#site-nav .links a:hover{background:var(--hl);color:var(--ink)}
#site-nav .launch{background:var(--card);color:var(--ink);border:1.6px solid var(--ink);border-radius:var(--r-hand);box-shadow:var(--shadow-p);font-family:'Caveat';font-size:17px;font-weight:700}
#site-nav .launch:hover{transform:rotate(-1deg)}
#site-nav.scrolled{border-bottom:1.5px solid var(--line-p)}
#site-nav.scrolled .links a{color:var(--pencil)}

/* HERO — one sheet of paper */
.lp-hero{background-color:var(--paper);color:var(--ink);padding:130px 20px 70px;position:relative}
.lp-hero .aurora{display:none}
.lp-hero h1{color:var(--ink);font-size:clamp(44px,5.6vw,72px);font-weight:700;line-height:1.02}
.lp-hero h1 .grad{color:var(--accent);-webkit-text-fill-color:var(--accent)}
.lp-hero p.lead{color:var(--pencil);font-size:19px;max-width:52ch}
.pill{background:none;border:none;padding:0;color:var(--pen);font-family:'Caveat';font-size:19px;font-weight:600;backdrop-filter:none}
.pill .dot{display:none}
.btn-xl{font-family:'Caveat';font-size:19px;font-weight:700;border:1.8px solid var(--ink);border-radius:var(--r-hand);box-shadow:var(--shadow-p)}
.btn-xl.pri{background:var(--card);color:var(--ink)}
.btn-xl.pri:hover{transform:rotate(-1deg) translateY(-2px);box-shadow:3px 5px 0 rgba(46,46,42,.12)}
.btn-xl.ghost{background:none;color:var(--pencil);border-color:var(--pencil)}
.btn-xl.ghost:hover{background:none;color:var(--ink);border-color:var(--ink)}
.btn-xl i[data-lucide]{display:none}
.hero-card{background:none;border:none;box-shadow:none;backdrop-filter:none;animation:none}
.hero-card .mock{background:var(--card);border:1.6px solid var(--ink);border-radius:var(--r-hand2);box-shadow:var(--shadow-p);position:relative}
.hero-card .mock::before{content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%) rotate(-2deg);width:74px;height:18px;background:rgba(255,232,130,.45);border:1px solid rgba(180,160,60,.25)}
.hero-card .mock .lbl{color:var(--pen);font-size:16px}
.hero-card .mock .lbl i{display:none}
.hero-meta{color:var(--pencil);font-family:'Gaegu';font-size:15px}

/* stats */
.lp-stats{background:var(--paper);border-bottom:1.5px solid var(--line-p)}
.lp-stats .v{color:var(--ink);font-size:44px;font-weight:700;-webkit-text-fill-color:var(--ink)}
.lp-stats .l{color:var(--pencil);font-size:15px;font-family:'Gaegu'}

/* sections */
.lp-sec .eyebrow{color:var(--pen);font-family:'Caveat';font-size:19px;letter-spacing:.04em}
.lp-sec h2{color:var(--ink);font-size:clamp(34px,4vw,46px);font-weight:700}
.lp-sec h2 .hl,.lp-hero h1 .hl{background:linear-gradient(transparent 55%,var(--hl) 0);padding:0 .1em}
.lp-sec .sub{color:var(--pencil);font-size:17px}
.lp-sec.alt{background:var(--paper2)}

/* steps / features / tiles — sketchy cards */
.step,.feat,.subj-tile{background:var(--card);border:1.6px solid var(--ink);border-radius:var(--r-hand);box-shadow:var(--shadow-p)}
.step:hover,.feat:hover,.subj-tile:hover{transform:rotate(-.4deg) translateY(-3px);box-shadow:3px 5px 0 rgba(46,46,42,.1)}
.step .n{background:none;box-shadow:none;color:var(--pen);font-family:'Caveat';font-size:30px;top:8px;left:14px;width:auto;height:auto}
.step .ico,.feat .ico,.subj-tile .ico{background:none;box-shadow:none;color:var(--ink);width:52px;height:52px}
.step .ico i,.feat .ico i,.subj-tile .ico i{display:none}
.step h3,.feat h3,.subj-tile h3{color:var(--ink);font-size:24px;font-weight:700}
.step p,.feat p,.subj-tile p{color:var(--pencil);font-size:16px}
.subj-tile::before{display:none}
.subj-tile .meta{color:var(--pencil);font-size:14.5px}
.subj-tile .meta i{display:none}
.subj-tile .doodle{position:absolute;top:16px;right:14px;opacity:.85}

/* faq */
.faq details{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r-hand2)}
.faq details[open]{box-shadow:var(--shadow-p)}
.faq summary{font-family:'Caveat');font-size:22px;font-weight:600;color:var(--ink)}
.faq summary{font-family:'Caveat',cursive}
.faq .chev{display:none}
.faq .ans{color:var(--pencil);font-size:16px}

/* cta band */
.lp-cta-band{background:var(--card);border:1.8px solid var(--ink);border-radius:var(--r-hand);color:var(--ink);box-shadow:var(--shadow-p)}
.lp-cta-band::after{display:none}
.lp-cta-band h2{color:var(--ink)}
.lp-cta-band p{color:var(--pencil)}
.lp-cta-band .btn-xl.pri{background:var(--hl);border-color:var(--ink)}

/* footer */
#site-footer{background:var(--paper);border-top:1.5px solid var(--line-p);color:var(--pencil)}
#site-footer .brand{color:var(--ink);font-size:19px}
#site-footer .brand .glyph{background:none;box-shadow:none;color:var(--accent);width:auto;height:auto}
#site-footer .brand .glyph i{display:none}

/* reveal: pencil = gentle fade + slight rise, no slide drama */
.rv{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.rv.in{opacity:1;transform:none}

/* ============ APP PAGES in pencil ============ */
#app-nav{background:rgba(251,250,244,.92);border-bottom:1.5px solid var(--line-p)}
#app-nav .logo{color:var(--ink);font-size:20px}
#app-nav .logo .dot{background:none;color:var(--accent)}
#app-nav .logo .dot i{display:none}
nav.main button{font-family:'Gaegu';font-size:16px;color:var(--pencil)}
nav.main button.on{background:var(--hl);color:var(--ink)}
.searchbox input{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r-hand2);font-family:'Gaegu';font-size:15px}
#app-main .hero{background:var(--card);border:1.8px solid var(--ink);border-radius:var(--r-hand);color:var(--ink);box-shadow:var(--shadow-p)}
#app-main .hero h1{color:var(--ink);font-size:44px}
#app-main .hero p{color:var(--pencil)}
.btn{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r-hand);font-family:'Gaegu';font-size:15px;color:var(--ink);box-shadow:none}
.btn:hover{background:var(--hl)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pri:hover{background:#000}
.btn.on{background:var(--hl);color:var(--ink);border-color:var(--ink)}
.card,.note-block,.quiz-setup,.scorebar,.q,.bq,.fc-face,.x-card,.sr,.stat,.side{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r-hand2);box-shadow:var(--shadow-p)}
.side{border-radius:var(--r-hand)}
.note-block{border-radius:var(--r-hand)}
.side button{font-family:'Gaegu';font-size:16px;color:var(--pencil)}
.side button.on{background:var(--hl);color:var(--ink)}
.side .sw{border-radius:2px}
table{background:var(--card);border-radius:12px}
th,td{border:1px solid var(--line-p);font-family:'Gaegu';font-size:15.5px}
th{background:var(--paper2);font-weight:700;color:var(--ink)}
.eq{background:var(--paper2);color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;font-family:'Gaegu';font-weight:500}
.callout{background:var(--card);border:1.5px solid var(--line-p);border-left:4px solid var(--accent);border-radius:12px;box-shadow:none}
.callout.warn{border-left-color:var(--pen);background:#fdf6f0}
.callout.tip{background:var(--accent-soft)}
.callout.good{border-left-color:#2f9e44;background:#f4faf2}
.callout.bad{border-left-color:var(--pen);background:#fdf2f2}
.tag{background:var(--ink);color:var(--paper);border-radius:8px;font-family:'Gaegu');font-weight:700}
.tag{font-family:'Gaegu'}
.cmdtag{background:var(--paper2);border:1px solid var(--line-p);color:var(--pencil);font-family:'Gaegu');font-weight:700}
.cmdtag{font-family:'Gaegu'}
.chip{background:var(--card);border:1.4px solid var(--ink);border-radius:20px;font-family:'Gaegu');color:var(--pencil)}
.chip{font-family:'Gaegu'}
.chip.on{background:var(--hl);color:var(--ink)}
.prog{background:var(--paper2);border:1px solid var(--line-p)}
.prog>i{background:var(--accent)}
.dchip{color:var(--pen)}
select{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;font-family:'Gaegu';font-size:15px}
.muted{color:var(--pencil)}
.fc-face{border-radius:var(--r-hand)}
.fc-back{background:var(--paper2)}
.fc-subj .tag{border-radius:8px}
.q .opts li{border:1.4px solid var(--line-p);border-radius:12px;font-family:'Gaegu');font-size:16px}
.q .opts li{font-family:'Gaegu'}
.q .opts li:hover{background:var(--hl)}
.q .opts li.right{background:#ebfbee;border-color:#2f9e44}
.q .opts li.wrong{background:#fff5f5;border-color:var(--pen)}
.q .exp{background:var(--paper2);border-left:3px solid var(--accent);border-radius:8px}
.bq .bq-head .qt{font-family:'Gaegu');font-weight:700}
.bq .bq-head .qt{font-family:'Gaegu';font-weight:700}
.bq-body{background:var(--paper2)}
.band{background:var(--card);border:1.4px solid var(--line-p);border-radius:12px;box-shadow:none}
.band-h{border-radius:11px 11px 0 0;font-family:'Permanent Marker',cursive}
.band-h{font-family:'Caveat',cursive}
.band-h i{display:none}
.b1 .band-h{background:#ffe3e3;color:#a61e1e}.b2 .band-h{background:#fff3bf;color:#8a5a00}
.b3 .band-h{background:#dbe4ff;color:#2747a8}.b4 .band-h{background:#d3f9d8;color:#166534}
.b1{border-color:#ffc9c9}.b2{border-color:#ffec99}.b3{border-color:#bac8ff}.b4{border-color:#b2f2bb}
.band-b .why{background:var(--paper2);border-radius:8px;color:var(--pencil)}
.band-b .why b{color:var(--ink)}
.x-card{border-radius:var(--r-hand)}
.empty{color:var(--pencil)}
@media print{
  body{background:#fff;background-image:none}
  .lp, #app-main, #site-footer{background-image:none}
}

/* ============ MARKER FONT + ROUGH ANIMATION OVERRIDES ============ */
@import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Shantell+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&display=swap');
body{font-family:'Shantell Sans','Gaegu',cursive}
h1,h2,h3,.logo,.brand,.v,.lbl,.pill,.btn-xl,.faq summary,.band-h,.step h3,.feat h3,.subj-tile h3,
.lp-hero h1,.lp-sec h2,.lp-cta-band h2,#app-main .hero h1,.lp-stats .l{font-family:'Permanent Marker','Caveat',cursive;font-weight:400;letter-spacing:.01em}
b,strong{font-weight:700}
.lp-hero h1,.lp-sec h2,.lp-cta-band h2{font-weight:400}

/* rougher doodle edges */
#r1 feTurbulence{ }
.dood{stroke-width:2.6}
svg filter, .dood{filter:url(#r1)}
#r1 feDisplacementMap{scale:3.2}

/* ---- pencil draw-in animation ---- */
.dood path,.dood circle{stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset 1.15s cubic-bezier(.4,.1,.3,1) .1s}
.lp .rv.in .dood path,.lp .rv.in .dood circle,
#page-home .rv.in .dood path,#page-home .rv.in .dood circle{stroke-dashoffset:0}
.lp-hero .dood path,.lp-hero .dood circle{stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset 1.6s ease .3s}
.lp-hero .rv.in .dood path,.lp-hero .rv.in .dood circle{stroke-dashoffset:0}

/* ---- scattered paper reveal ---- */
.rv{transform:translateY(20px) rotate(var(--rot,0deg));opacity:0;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.3,1)}
.rv.in{transform:rotate(var(--rot,0deg))}
.rv.d1{--rot:-.7deg}.rv.d2{--rot:.5deg}.rv.d3{--rot:-.4deg}.rv.d4{--rot:.7deg}.rv.d5{--rot:-.5deg}
.steps .step:nth-child(odd){--rot:-.7deg}
.steps .step:nth-child(even){--rot:.5deg}
.feats .feat:nth-child(3n){--rot:.5deg}
.feats .feat:nth-child(3n+1){--rot:-.5deg}
.subj-grid .subj-tile:nth-child(3n){--rot:.4deg}
.subj-grid .subj-tile:nth-child(3n+1){--rot:-.5deg}
.subj-grid .subj-tile:nth-child(3n+2){--rot:.6deg}
.step:hover,.feat:hover,.subj-tile:hover{transform:rotate(0deg) translateY(-3px);box-shadow:4px 7px 0 rgba(46,46,42,.09)}
.subj-tile:hover .ico .dood{transform:rotate(-6deg) scale(1.06);transition:transform .3s}

/* ---- scribble underline under section headings ---- */
.lp-sec h2,.lp-cta-band h2{display:inline-block;position:relative}
.lp-sec h2::after,.lp-cta-band h2::after{content:'';position:absolute;left:-2%;right:-4%;bottom:-14px;height:12px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 12' preserveAspectRatio='none'><path d='M2 8 C 40 3, 70 10, 110 6 S 190 2, 230 8 S 280 5, 298 7' fill='none' stroke='%23c92a2a' stroke-width='3' stroke-linecap='round' opacity='0.75'/></svg>") no-repeat center/100% 100%;
  transform:rotate(-.6deg)}
.lp-hero h1 .grad::after{content:'';position:absolute}

/* marker highlight on stat numbers */
.lp-stats .v{position:relative;display:inline-block}
.lp-stats .v::after{content:'';position:absolute;left:-8%;right:-8%;bottom:2px;height:38%;background:var(--hl);z-index:-1;transform:rotate(-1deg)}

/* CTA + hero buttons: marker-drawn feel */
.btn-xl.pri{position:relative}

<script>
const SUBJECTS = {
resp:{id:'resp',name:'Respiratory System',short:'Respiratory',color:'#0369a1',icon:'🫁',
blurb:'Ventilation → gas exchange → cellular respiration. How air gets in, how O₂ crosses into blood, and how cells cash it into ATP.',
notes:`<h4>1 · Three processes, one pipeline</h4>
<table>
<tr><th>Process</th><th>What it is</th><th>Where</th><th>Moves what</th></tr>
<tr><td><b>Ventilation</b></td><td>Physical movement of air between atmosphere and lungs (breathing)</td><td>Lungs / airways</td><td>Air (O₂ in, CO₂ out)</td></tr>
<tr><td><b>Gas exchange</b></td><td>Passive diffusion of gases across the alveolar walls</td><td>Alveoli ↔ capillaries</td><td>O₂ into blood, CO₂ out</td></tr>
<tr><td><b>Cellular respiration</b></td><td>Enzyme-controlled release of energy from organic molecules → ATP</td><td>Mitochondria (all living cells)</td><td>Glucose + O₂ → ATP + CO₂ + H₂O</td></tr>
</table>
<div class="callout tip"><b>The chain (this sentence pattern scores):</b> ventilation keeps the alveoli rich in O₂ and poor in CO₂ → this <b>maintains the concentration gradient</b> → diffusion loads the blood → the cardiovascular system delivers O₂ to respiring cells → mitochondria make ATP. Break any link and ATP production falls.</div>

<svg viewBox="0 0 680 74" style="width:100%;height:auto;display:block" role="img" aria-label="Three processes chain">
<defs><marker id="ar1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs>
<g font-size="12.5" fill="#17203a">
<rect x="2" y="18" width="150" height="38" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="77" y="42" text-anchor="middle">Ventilation</text>
<rect x="178" y="18" width="150" height="38" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="253" y="42" text-anchor="middle">Gas exchange</text>
<rect x="354" y="18" width="160" height="38" rx="8" fill="#fef3c7" stroke="#b45309"/><text x="434" y="42" text-anchor="middle">Blood transport</text>
<rect x="540" y="18" width="138" height="38" rx="8" fill="#ede9fe" stroke="#6d28d9"/><text x="609" y="42" text-anchor="middle">Cell respiration</text>
<line x1="154" y1="37" x2="176" y2="37" stroke="#2563eb" stroke-width="2" marker-end="url(#ar1)"/>
<line x1="330" y1="37" x2="352" y2="37" stroke="#2563eb" stroke-width="2" marker-end="url(#ar1)"/>
<line x1="516" y1="37" x2="538" y2="37" stroke="#2563eb" stroke-width="2" marker-end="url(#ar1)"/>
<text x="340" y="70" text-anchor="middle" fill="#5b6478">each output is the next process's input — the output of respiration (CO₂-rich blood) feeds back to ventilation</text>
</g></svg>
<p class="figcap">The pipeline. Respiration's waste product is ventilation's reason to speed up.</p>

<h4>2 · Ventilation — the mechanics</h4>
<table>
<tr><th></th><th>Inhaling</th><th>Exhaling</th></tr>
<tr><td><b>Diaphragm</b></td><td>Contracts → flattens, moves down</td><td>Relaxes → domes back up</td></tr>
<tr><td><b>Intercostal muscles</b></td><td>Contract → ribs move up and out</td><td>Relax → ribs move down and in</td></tr>
<tr><td><b>Chest volume</b></td><td>Increases</td><td>Decreases</td></tr>
<tr><td><b>Lung pressure</b></td><td>Falls <b>below</b> atmospheric pressure</td><td>Rises <b>above</b> atmospheric pressure</td></tr>
<tr><td><b>Air movement</b></td><td>Flows in, down the pressure gradient</td><td>Flows out, down the pressure gradient</td></tr>
</table>
<p><b>Airway structures and why they're shaped that way:</b> the <b>trachea</b> is held open by C-shaped cartilage rings — rigid enough that it never collapses when you inhale, but the open C lets the oesophagus bulge into it when you swallow. <b>Bronchi</b> are the two large branches; <b>bronchioles</b> have smooth muscle in their walls so airflow to each alveolus can be tuned (that's why asthma — bronchioles constricting — cuts airflow so effectively).</p>

<h4>3 · Gas exchange at the alveolus</h4>
<svg viewBox="0 0 680 190" style="width:100%;height:auto;display:block" role="img" aria-label="Alveolus gas exchange diagram">
<defs><marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#be1239"/></marker>
<marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0369a1"/></marker></defs>
<g font-size="12.5" fill="#17203a">
<circle cx="340" cy="92" r="72" fill="#f0f9ff" stroke="#0369a1" stroke-width="2" stroke-dasharray="5 4"/>
<text x="340" y="26" text-anchor="middle" font-weight="700">Alveolus (air)</text>
<ellipse cx="180" cy="92" rx="26" ry="20" fill="#fee2e2" stroke="#be1239" stroke-width="2"/>
<text x="180" y="96" text-anchor="middle" font-size="11">RBC</text>
<ellipse cx="470" cy="92" rx="26" ry="20" fill="#fee2e2" stroke="#be1239" stroke-width="2"/>
<text x="470" y="96" text-anchor="middle" font-size="11">RBC</text>
<line x1="330" y1="66" x2="240" y2="78" stroke="#0369a1" stroke-width="3" marker-end="url(#ar3)"/>
<text x="272" y="66" fill="#0369a1">O₂ diffuses OUT to blood</text>
<line x1="220" y1="112" x2="330" y2="118" stroke="#be1239" stroke-width="3" marker-end="url(#ar2)"/>
<text x="232" y="134" fill="#be1239">CO₂ diffuses IN from blood</text>
<text x="340" y="86" text-anchor="middle" font-size="11" fill="#5b6478">wall + capillary wall</text>
<text x="340" y="100" text-anchor="middle" font-size="11" fill="#5b6478">= one cell thick total</text>
<text x="340" y="150" text-anchor="middle" font-size="11" fill="#5b6478">O₂ high in alveoli (just breathed in) · O₂ low in arriving blood</text>
<text x="340" y="166" text-anchor="middle" font-size="11" fill="#5b6478">CO₂ high in arriving blood (from respiring muscles) · CO₂ low in alveoli</text>
<text x="340" y="184" text-anchor="middle" font-size="11" fill="#5b6478">→ passive diffusion, always high → low concentration, never the reverse</text>
</g></svg>
<p class="figcap">Both gases move by passive diffusion — no energy, no pump, only gradients. Blood flow keeps refreshing the gradient.</p>
<p><b>The five alveolar adaptations</b> (state all five when asked "how is the lung adapted?"):</p>
<ol>
<li><b>One-cell-thick wall</b> (~0.5 µm) — the shortest possible diffusion distance.</li>
<li><b>Moist lining</b> — O₂ and CO₂ must dissolve before they can cross a membrane.</li>
<li><b>Dense capillary network</b> — blood flows constantly past each alveolus, so the gradient never collapses.</li>
<li><b>Enormous surface area</b> (~70 m² in an adult) — millions of small sacs pack tennis-court area into a chest.</li>
<li><b>Elastic fibres</b> — stretch on inhalation, recoil on exhalation to help push air out.</li>
</ol>
<div class="callout tip"><b>The classic application question — "lungs the size of two footballs, but spread-flat alveoli cover a tennis court. How?"</b><br>Answer in two moves: (1) there are <b>hundreds of millions</b> of alveoli, and (2) breaking one big sphere into millions of tiny spheres multiplies surface area enormously while shrinking total volume. Then link it back: surface area is exactly what diffusion needs, because diffusion only works fast enough across short distances and thin walls.</div>
<p><b>Alveoli vs microvilli (a favourite compare question):</b> same trick, different job. Both maximise surface area with a one-cell-thick exchange surface. Microvilli are folds of a cell membrane in the small intestine absorbing digested nutrients; alveoli are air sacs exchanging gases between air and blood. One absorbs dissolved food, one swaps gases.</p>

<h4>4 · Moving oxygen once it's in</h4>
<p><b>Red blood cells</b> are built for transport: <b>biconcave</b> (large surface-area-to-volume for fast O₂ pickup), <b>no nucleus</b> (more room for haemoglobin), packed with <b>haemoglobin</b> which binds O₂ in the lungs (forming oxyhaemoglobin) and releases it at respiring tissues, and flexible enough to squeeze through capillaries one cell wide. Most CO₂ travels back in the plasma as <b>bicarbonate ions</b>.</p>

<h4>5 · Cellular respiration — the ATP factory</h4>
<div class="eq">word: glucose + oxygen → carbon dioxide + water + energy (ATP)<br>symbol: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O</div>
<table>
<tr><th>Stage</th><th>Where</th><th>O₂ needed?</th><th>Inputs → outputs</th></tr>
<tr><td><b>1. Glycolysis</b></td><td>Cytoplasm</td><td>No</td><td>Glucose → 2 pyruvate + <b>2 net ATP</b> + 2 NADH</td></tr>
<tr><td><b>2. Krebs cycle</b></td><td>Mitochondrial matrix</td><td>No (indirectly)</td><td>Pyruvate → CO₂ + electron carriers + small ATP</td></tr>
<tr><td><b>3. Electron transport chain / oxidative phosphorylation</b></td><td>Inner mitochondrial membrane</td><td><b>Yes — this is where O₂ is used</b></td><td>Electrons + O₂ → H₂O + <b>~32–34 ATP</b></td></tr>
</table>
<div class="callout warn"><b>Careful with one line in the class notes:</b> "CO₂ is a by-product in both modes of respiration" is only true for <b>yeast</b>. In <b>animals</b>, anaerobic respiration (glucose → lactate) releases <b>no CO₂ at all</b>. If an exam question asks about human muscle, lactate is the product and CO₂ is absent.</div>
<table>
<tr><th></th><th>Aerobic</th><th>Anaerobic (animals)</th><th>Anaerobic (yeast)</th></tr>
<tr><td>Oxygen</td><td>Required</td><td>Not required</td><td>Not required</td></tr>
<tr><td>Location</td><td>Mitochondria (after glycolysis)</td><td>Cytoplasm only</td><td>Cytoplasm only</td></tr>
<tr><td>ATP per glucose</td><td>~30–34 (lots)</td><td><b>2</b> (net)</td><td><b>2</b> (net)</td></tr>
<tr><td>Products</td><td>CO₂ + H₂O</td><td>Lactate</td><td>Ethanol + CO₂</td></tr>
</table>
<p><b>ATP ↔ ADP is the currency exchange:</b> respiration <b>builds</b> ATP from ADP + phosphate (an energy-storing reaction); cells <b>spend</b> ATP by breaking it back down, releasing energy for muscle contraction, nerve impulses, protein synthesis, active transport and cell division.</p>
<p><b>The burning-glucose demo</b> you saw in class maps directly onto the equation: blue cobalt chloride paper turns <b>pink</b> when glucose burns (water produced); limewater turns <b>milky</b> (CO₂ produced); glucose burns far more vigorously in pure oxygen than in air — more oxygen, faster combustion, more energy released per second.</p>

<h4>6 · Case-study analysis (the "evaluate a scenario" pattern)</h4>
<table>
<tr><th>Condition</th><th>Structure affected</th><th>Effect on gas exchange</th><th>Symptoms you'd expect</th></tr>
<tr><td><b>Asthma</b></td><td>Bronchiole smooth muscle constricts; airways narrow</td><td>Less air reaches alveoli → less O₂ available to diffuse</td><td>Wheezing, shortness of breath, especially on exertion</td></tr>
<tr><td><b>Pneumonia</b></td><td>Alveoli fill with fluid (mucus/pus)</td><td>Longer diffusion path; O₂ can't dissolve across easily → gradient collapses</td><td>Breathlessness, fever, chest pain, coughing</td></tr>

<div class="callout tip"><b>The four-step answer pattern for any scenario question:</b> (1) name the structure affected, (2) say how gas exchange specifically changes (gradient? distance? surface area?), (3) say what happens to cellular respiration (less O₂ → less ATP), (4) link the symptom to the cause. Marks come from the chain, not the label.</div>
<p class="muted">Extension: leaves vs lungs — both use large surface area, thin walls and diffusion, but a leaf has no ventilation system: gases move in and out by diffusion through stomata, and the "flow" that keeps gradients alive is wind and transpiration, not a pump.</p>`,
cards:[
{q:'Define ventilation',a:'Exchange of air between the atmosphere and the lungs, achieved by breathing.'},
{q:'Define gas exchange',a:'Diffusion of O₂ and CO₂ between the alveoli and the bloodstream — passive, high to low concentration.'},
{q:'Define cellular respiration',a:'Release of energy (ATP) from organic molecules, occurring in the mitochondria.'},
{q:'Inhaling: diaphragm + intercostals',a:'Diaphragm contracts (flattens down), intercostals contract (ribs up and out) → chest volume ↑ → pressure ↓ → air in.'},
{q:'Exhaling: what happens?',a:'Diaphragm relaxes (domes up), intercostals relax (ribs down and in) → volume ↓ → pressure rises above atmospheric → air out.'},
{q:'Why is the trachea reinforced with C-shaped cartilage?',a:'Holds the airway open on inhalation; the C-shape leaves room for the oesophagus to expand during swallowing.'},
{q:'Name the five alveolar adaptations',a:'One-cell-thick wall (~0.5 µm); moist lining; dense capillary network; ~70 m² surface area; elastic fibres.'},
{q:'Which way does O₂ diffuse at the alveolus, and why?',a:'Alveolus → blood: O₂ is high in freshly-inhaled alveolar air and low in blood returning from the body.'},
{q:'Three specialisations of red blood cells',a:'Biconcave (large surface area); no nucleus (more haemoglobin); haemoglobin binds O₂; flexible to squeeze through capillaries.'},
{q:'Word + symbol equation for aerobic respiration',a:'glucose + oxygen → CO₂ + water (+ ATP). C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O.'},
{q:'Glycolysis: location, inputs, outputs',a:'Cytoplasm. Glucose → 2 pyruvate + 2 net ATP + 2 NADH. No oxygen needed.'},
{q:'Where do the Krebs cycle and electron transport chain happen?',a:'Krebs = mitochondrial matrix; ETC = inner mitochondrial membrane (this is where O₂ is actually used).'},
{q:'Aerobic vs anaerobic: ATP yield',a:'Aerobic ≈ 30–34 ATP per glucose (needs O₂). Anaerobic = 2 net ATP (glycolysis only).'},
{q:'Fermentation products: animals vs yeast',a:'Animals: lactate (no CO₂). Yeast: ethanol + CO₂.'},
{q:'What does the cardiovascular system do for gas exchange?',a:'Maintains the concentration gradient — blood flow constantly carries O₂ away and brings fresh CO₂-rich blood.'},
{q:'ATP ↔ ADP + Pi',a:'Respiration builds ATP from ADP + phosphate; breaking ATP down releases energy for muscle contraction, nerve impulses, active transport.'},
{q:'Cobalt chloride paper + limewater in the burning-glucose demo',a:'Cobalt chloride blue → pink = water produced; limewater clear → milky = CO₂ produced.'},
{q:'Asthma: how does it affect gas exchange?',a:'Bronchioles constrict → less air reaches the alveoli → less O₂ available to diffuse → lower ATP output → wheeze/breathlessness.'},
{q:'Pneumonia: the gas-exchange mechanism',a:'Alveoli fill with fluid → longer diffusion path and O₂ can\'t dissolve across → gradient collapses → less O₂ per litre of blood.'},
{q:'Emphysema: the gas-exchange mechanism',a:'Alveolar walls break down → surface area collapses → diffusion rate falls even though air still moves.'},
{q:'Alveoli vs microvilli (compare)',a:'Both maximise surface area with one-cell-thick exchange surfaces. Microvilli = membrane folds absorbing digested nutrients in the gut; alveoli = air sacs diffusing gases.'}
],
quiz:[
{q:'Which vessel carries deoxygenated blood away from the heart to the lungs?',o:['Pulmonary vein','Pulmonary artery','Aorta','Vena cava'],a:1,e:'The pulmonary artery — the exception to "arteries carry oxygen-rich blood". The name follows direction: arteries go AWAY from the heart.'},
{q:'Glycolysis takes place in the…',o:['Mitochondrial matrix','Inner mitochondrial membrane','Cytoplasm','Nucleus'],a:2,e:'Cytoplasm. It is the anaerobic first stage: glucose → 2 pyruvate + 2 net ATP + 2 NADH.'},
{q:'Which is NOT an adaptation of alveoli for gas exchange?',o:['One-cell-thick walls','Moist lining','Rich capillary network','Cilia that sweep mucus'],a:3,e:'Cilia/mucus sweeping is a trachea/bronchi job for removing particles. The five alveolar adaptations are thin wall, moist lining, capillaries, ~70 m² area, elastic fibres.'},
{q:'O₂ diffuses from alveolus into blood because…',o:['the heart pumps it in','O₂ concentration is higher in the alveoli than in the arriving blood','blood is under high pressure','O₂ dissolves in the alveolar fluid first'],a:1,e:'Passive diffusion follows the concentration gradient. Dissolving matters for HOW it crosses the membrane, but the driving force is the gradient that ventilation and blood flow maintain.'},
{q:'During exercise, breathing rate rises mainly because…',o:['cells need more ATP, use more O₂ and produce more CO₂','the lungs get bigger','the heart slows down','CO₂ concentration rises in the alveoli'],a:0,e:'Muscles respire faster → more O₂ used, more CO₂ produced → steeper gradients → faster/deeper breathing restores them. (CO₂ actually falls in the alveoli as ventilation increases.)'},
{q:'Anaerobic respiration in human muscle produces…',o:['ethanol + CO₂','lactate, 2 net ATP','CO₂ + water','about 34 ATP'],a:1,e:'Lactate + 2 net ATP, glycolysis only, no oxygen. Ethanol + CO₂ is yeast fermentation.'},
{q:'The main reason capillaries are only one blood cell wide is…',o:['to keep blood pressure high','so blood flows slowly and the wall is thin — maximising exchange','so valves can work','so they can stretch'],a:1,e:'One-RBC-wide = slow flow; one-cell-thick wall = short diffusion distance. Both maximise exchange.'},
{q:'Elastic fibres in the alveoli help by…',o:['carrying oxygen','filtering bacteria','stretching on inhalation and recoiling to push air out on exhalation','producing mucus'],a:2,e:'Elastic recoil also does much of the work of normal (quiet) exhalation.'},
{q:'Which correctly describes the trachea?',o:['Rings of solid bone to stop collapse','C-shaped cartilage to stay open while letting the oesophagus expand','Complete cartilage rings forming a tight seal','Muscle rings that squeeze like the gut'],a:1,e:'C-shaped rings: rigid airway + space for the oesophagus to bulge into during swallowing.'},
{q:'Breathing 12 → 30 breaths per minute after a mile: the best explanation is…',o:['the lungs are now bigger','the gradient for O₂ and CO₂ at the alveoli has increased','less CO₂ is being produced','blood pressure has dropped'],a:1,e:'More CO₂ in / less O₂ in arriving blood = bigger gradients; faster breathing restores them so respiration can keep making ATP.'}

bank:[
{cmd:'State',t:'Definitions',d:1,q:'Define ventilation, gas exchange and cellular respiration, and give one specific example of how they depend on each other.',a:'Ventilation = movement of air between atmosphere and lungs by breathing. Gas exchange = diffusion of O₂ and CO₂ between alveoli and blood. Cellular respiration = release of ATP energy from organic molecules in the mitochondria. Dependence: without ventilation the alveolar gradient collapses → no gas exchange → cells can\'t respire aerobically. Example: during exercise faster breathing supplies the O₂ muscles now use faster.'},
{cmd:'Outline',t:'Ventilation',d:1,q:'Outline the process of inhaling, naming the muscles and the pressure change.',a:'The diaphragm contracts and flattens (moves down) while the external intercostal muscles contract and pull the ribs up and out → chest volume increases → pressure inside the lungs falls below atmospheric pressure → air flows in down the pressure gradient.'},
{cmd:'Describe',t:'Gas exchange',d:2,q:'Describe how the lungs are adapted for efficient gas exchange.',a:'(1) Alveolar walls one cell thick (~0.5 µm) — short diffusion distance. (2) Moist lining — gases dissolve before crossing membranes. (3) Dense capillary network — constantly refreshes the gradient. (4) ~70 m² surface area from millions of alveoli. (5) Elastic fibres — stretch on inhalation, recoil on exhalation. Gas moves by passive diffusion: O₂ alveolus→blood, CO₂ blood→alveolus.'},
{cmd:'Explain',t:'Gas exchange',d:2,q:'Explain why your breathing rate increases from 12 to 30 breaths per minute after running a mile.',a:'Muscle cells respire faster to release more ATP for contraction → they consume more O₂ and produce more CO₂ → blood reaching the lungs has less O₂ and more CO₂ → the alveolar gradients increase → breathing faster and deeper restores them, supplying O₂ and removing CO₂ (which would acidify the blood). Heart rate rises to match delivery.'},
{cmd:'Compare',t:'Respiration',d:2,q:'Compare aerobic and anaerobic respiration: where they occur, the ATP yield, and the products.',a:'Aerobic needs oxygen, occurs in the mitochondria after glycolysis (Krebs in the matrix, ETC on the inner membrane), yields ~30–34 ATP per glucose, products CO₂ + water. Anaerobic needs no oxygen, is glycolysis only in the cytoplasm, yields 2 net ATP; animals produce lactate, yeast produce ethanol + CO₂. Both begin with glycolysis.'},
{cmd:'Describe',t:'Respiration',d:2,q:'Describe the stages of aerobic respiration from glucose, stating where each stage occurs.',a:'Glycolysis in the cytoplasm: glucose → 2 pyruvate + 2 net ATP + 2 NADH, no O₂ needed. Krebs cycle in the mitochondrial matrix: pyruvate fully broken down, releasing CO₂ and loading electron carriers. Electron transport chain on the inner mitochondrial membrane: O₂ is the final electron acceptor, forming water, and ~32–34 ATP is produced.'},
{cmd:'Explain',t:'Case studies',d:2,q:'A patient with pneumonia has fluid filling the alveoli. Explain how this affects gas exchange and cellular respiration.',a:'The fluid increases the diffusion distance between alveolar air and blood and prevents O₂ from dissolving across properly → the concentration gradient collapses → less O₂ diffuses into the blood per litre → less O₂ reaches the mitochondria → aerobic respiration produces less ATP → cells (especially during exertion) cannot meet energy demand → breathlessness and fatigue.'},
{cmd:'Evaluate',t:'Case studies',d:3,q:'Evaluate the claim: "patients with asthma cannot exercise because their lungs cannot hold enough air."',a:'Not supported — the claim fails on both the mechanism and the outcome. Mechanism: asthma narrows the bronchioles (smooth muscle constriction), which limits airflow, not lung capacity — the alveoli are intact, so surface area and volume are unchanged. The complaint would be that air moves too slowly in and out, not that the lungs cannot hold enough. Outcome: people with asthma can and do exercise — with a reliever inhaler, a warm-up and controlled intensity, exercise-induced bronchoconstriction is manageable, and regular exercise actually improves control. Grain of truth: in a severe untreated attack, ventilation is limited enough that exertion becomes impossible — but that is temporary airflow obstruction, not lung volume. Conclusion: the claim is not supported; it confuses airflow limitation with lung capacity.',bd:{b12:'Partly supported: bronchoconstriction narrows the airways, so less air reaches the alveoli and maximum O2 uptake falls.',w12:'This is the trap \u2014 it accepts the claim mechanism. Asthma limits airflow, not air capacity, and people with asthma can exercise, so the verdict itself is wrong: a Band 1\u20132 answer asserts an unsupported claim as if it were fact.',b34:'Not supported \u2014 the claim fails on both the mechanism and the outcome.',w34:'The verdict is now correct, but it is asserted with no mechanism behind it, so it earns the claim mark and nothing more.',b56:'Not supported \u2014 asthma narrows the bronchioles, which limits airflow, not lung capacity: the alveoli are intact. And people with asthma can and do exercise with a reliever inhaler and a warm-up.',w56:'It now earns the verdict with the correct mechanism (airflow vs capacity) plus the outcome evidence.',b78:'Not supported \u2014 the claim fails on both the mechanism and the outcome. Mechanism: asthma narrows the bronchioles (smooth muscle constriction), which limits airflow, not lung capacity \u2014 the alveoli are intact, so surface area and volume are unchanged. The complaint would be that air moves too slowly in and out, not that the lungs cannot hold enough. Outcome: people with asthma can and do exercise \u2014 with a reliever inhaler, a warm-up and controlled intensity, exercise-induced bronchoconstriction is manageable, and regular exercise actually improves control. Grain of truth: in a severe untreated attack, ventilation is limited enough that exertion becomes impossible \u2014 but that is temporary airflow obstruction, not lung volume. Conclusion: the claim is not supported; it confuses airflow limitation with lung capacity.',w78:'The full-marks differentiator: it concedes the grain of truth (a severe untreated attack) and still rejects the claim, because it separates airflow limitation from lung capacity instead of mixing them.'}},
{cmd:'Explain',t:'Integration',d:2,q:'Explain how the digestive, respiratory and cardiovascular systems work together to supply cells with energy.',a:'Digestion breaks food into glucose (amylase) and absorbs it into the blood. Ventilation keeps alveoli high in O₂ / low in CO₂ so gas exchange loads the blood. The cardiovascular system transports O₂ (on haemoglobin), glucose and amino acids to cells and removes CO₂. In mitochondria, aerobic respiration uses glucose + O₂ to release ATP. Break any one system and ATP output falls.'},
{cmd:'Describe',t:'Respiration',d:2,q:'Describe the role of red blood cells in transporting oxygen.',a:'Biconcave shape gives a large surface-area-to-volume ratio for O₂ pickup; no nucleus leaves maximum room for haemoglobin; haemoglobin binds O₂ in the lungs (oxyhaemoglobin) and releases it at respiring tissues where O₂ concentration is low; the flexible membrane lets them squeeze through capillaries one cell wide.'}
]},

blurb:'Double circulation, heart chambers and valves, vessel structure, blood pressure, and why the heart is a pump for the gradient.',
notes:`<h4>1 · One system, two loops</h4>
<p>Humans run a <b>double circulation</b>: the right side of the heart pumps deoxygenated blood to the lungs and back (the <b>pulmonary circuit</b>), and the left side pumps oxygenated blood to the whole body and back (the <b>systemic circuit</b>). The blood passes through the heart <b>twice</b> per full lap — that's what "double" means, and it's what keeps pressure high on the systemic side.</p>
<svg viewBox="0 0 680 210" style="width:100%;height:auto;display:block" role="img" aria-label="Double circulation diagram">
<defs><marker id="ac1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker></defs>
<g font-size="12" fill="#17203a">
<rect x="290" y="82" width="100" height="46" rx="8" fill="#fff" stroke="#be1239" stroke-width="2.5"/>
<text x="340" y="101" text-anchor="middle" font-weight="700">HEART</text><text x="340" y="117" text-anchor="middle" font-size="11">4 chambers</text>
<ellipse cx="545" cy="46" rx="52" ry="26" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="545" y="51" text-anchor="middle">Lungs</text>
<rect x="60" y="120" width="120" height="34" rx="8" fill="#fee2e2" stroke="#be1239" stroke-width="2"/>
<text x="120" y="141" text-anchor="middle">Body tissues</text>
<path d="M 390 95 L 470 66" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#ac1)"/>
<text x="428" y="76" text-anchor="middle" font-size="11" fill="#0369a1">pulmonary artery</text><text x="428" y="88" text-anchor="middle" font-size="11" fill="#0369a1">(deoxygenated!)</text>
<path d="M 490 42 L 398 84" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#ac1)"/>
<text x="452" y="52" text-anchor="middle" font-size="11" fill="#0369a1">pulmonary vein</text><text x="452" y="64" text-anchor="middle" font-size="11" fill="#0369a1">(oxygenated!)</text>
<path d="M 290 105 L 180 118" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#ac1)"/>
<text x="235" y="106" text-anchor="middle" font-size="11" fill="#0369a1">aorta → arteries</text>
<path d="M 120 120 L 330 118" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#ac1)"/>
<text x="225" y="134" text-anchor="middle" font-size="11" fill="#0369a1">vena cava ← veins</text>
<text x="120" y="172" text-anchor="middle" font-size="11" fill="#5b6478">capillaries: O₂ out, CO₂ in</text>
<text x="545" y="92" text-anchor="middle" font-size="11" fill="#5b6478">capillaries: CO₂ out, O₂ in</text>
</g></svg>
<p class="figcap">Pulmonary circuit (right side) ↔ Systemic circuit (left side). The two "special" vessels swap the usual oxygen content.</p>

<h4>2 · Inside the heart</h4>
<table>
<tr><th>Structure</th><th>Function</th><th>Exam detail that scores</th></tr>
<tr><td><b>Right atrium</b></td><td>Receives deoxygenated blood from the body (vena cava)</td><td>Thin wall — it only pushes blood to the ventricle below</td></tr>
<tr><td><b>Right ventricle</b></td><td>Pumps deoxygenated blood to the lungs via the pulmonary artery</td><td>Medium-thick wall — short, low-resistance trip to the lungs</td></tr>
<tr><td><b>Left atrium</b></td><td>Receives oxygenated blood from the lungs (pulmonary vein)</td><td>Thin wall</td></tr>
<tr><td><b>Left ventricle</b></td><td>Pumps oxygenated blood to the whole body via the aorta</td><td><b>Thickest muscular wall</b> — the longest, highest-pressure job</td></tr>
<tr><td><b>Valves</b> (AV valves, semilunar valves)</td><td>Ensure blood flows one way; prevent backflow</td><td>"Valves are like doors that only open one way" — they close with the heartbeat</td></tr>
<tr><td><b>Septum</b></td><td>Wall dividing left and right sides</td><td>Keeps oxygenated and deoxygenated blood separate</td></tr>
</table>
<p><b>Why "lub-dub" exists:</b> the "lub" is the AV valves snapping shut when the ventricles contract (blood hitting the closed valve), and the "dub" is the semilunar valves shutting behind blood leaving for the arteries. One heartbeat = two valve closures.</p>
<p><b>The cardiac cycle in one line:</b> atria contract → ventricles contract → all chambers relax → repeat. Atria contract first to fill the ventricles; the ventricles then do the pumping.</p>

<h4>3 · The full blood path (learn it as one sentence)</h4>
<div class="callout tip" style="font-size:14.5px"><b>Body → vena cava → right atrium → AV valve → right ventricle → pulmonary valve → <u>pulmonary artery</u> → lung capillaries → <u>pulmonary vein</u> → left atrium → AV valve → left ventricle → aortic valve → aorta → arteries → arterioles → capillaries → venules → veins → vena cava → repeat.</b><br>Four check questions: which chamber receives deoxygenated blood from the body? <b>Right atrium.</b> Which pumps it to the lungs? <b>Right ventricle.</b> Which receives oxygenated blood from the lungs? <b>Left atrium.</b> Which pumps it to the body? <b>Left ventricle.</b></div>

<h4>4 · The three vessel types — form follows function</h4>
<table>
<tr><th></th><th>Arteries</th><th>Veins</th><th>Capillaries</th></tr>
<tr><td><b>Function</b></td><td>Carry blood <b>away</b> from the heart</td><td>Carry blood <b>back to</b> the heart</td><td>Exchange materials with tissues</td></tr>
<tr><td><b>Pressure</b></td><td>High (ventricles push hard)</td><td>Low (far from the pump)</td><td>Low — slow flow for exchange</td></tr>
<tr><td><b>Lumen</b></td><td>Narrow (keeps pressure high)</td><td>Wide (low pressure needs volume)</td><td>Very narrow — one blood cell wide</td></tr>
<tr><td><b>Wall</b></td><td>Thick, muscular, elastic (handles the pulse)</td><td>Thin (low pressure, less muscle needed)</td><td><b>One cell thick</b> — short diffusion distance</td></tr>
<tr><td><b>Valves</b></td><td>No (pressure keeps blood moving forward)</td><td><b>Yes</b> (stop blood falling backwards)</td><td>No</td></tr>
</table>
<p><b>The naming rule that beats the oxygen myth:</b> arteries go <b>AWAY</b>, veins come <b>BACK</b>. Oxygen content has nothing to do with the name. The pulmonary artery (deoxygenated) and pulmonary vein (oxygenated) are the two exceptions that prove the rule.</p>

<h4>5 · Blood and transport</h4>
<ul>
<li><b>Plasma</b> — straw-coloured liquid carrying dissolved CO₂ (as bicarbonate), glucose, amino acids, urea, hormones, and heat.</li>
<li><b>Red blood cells</b> — haemoglobin transports O₂ (see the respiratory page).</li>
<li><b>White blood cells</b> — immune defence (phagocytosis, antibodies).</li>
<li><b>Platelets</b> — clotting at wounds.</li>
</ul>
<p><b>Why circulation is the gradient-keeper:</b> at the alveoli and at body cells, diffusion only continues while gradients exist. Blood flow is what <b>maintains</b> those gradients — carrying O₂ away from alveoli and away from capillaries, and bringing fresh CO₂-rich blood back.</p>

<h4>6 · Exercise, pulse and blood pressure</h4>
<ul>
<li><b>Heart rate during exercise:</b> rises — muscles respire faster, so they need more O₂ + glucose delivered and more CO₂ removed per minute. Pulse (beats/min) is the direct measure of that.</li>
<li><b>Blood pressure:</b> written as two numbers, e.g. 120/80 mmHg — <b>systolic</b> (pressure when ventricles contract, the high number) over <b>diastolic</b> (pressure when the heart relaxes, the low number).</li>
<li><b>Hypertension</b> = persistently high blood pressure → damages arteries, raises heart-attack and stroke risk. Regular exercise strengthens the heart so it pumps more per beat at a lower rate.</li>
</ul>
<h4>7 · Conditions worth a one-liner</h4>
<table>
<tr><td><b>Coronary artery disease</b></td><td>Fatty deposits narrow the coronary arteries → heart muscle gets less O₂ → angina / heart attack</td></tr>
<tr><td><b>Hypertension</b></td><td>Persistently high blood pressure; strains arteries and heart</td></tr>
<tr><td><b>Heart failure</b></td><td>The heart can't pump enough blood to meet the body's demand</td></tr>
<tr><td><b>Arrhythmia</b></td><td>Irregular heartbeat</td></tr>
<tr><td><b>Stroke</b></td><td>Blood supply to part of the brain is cut off</td></tr>
<tr><td><b>Peripheral artery disease</b></td><td>Narrowed arteries reduce blood flow to the limbs</td></tr>
</table>`,

{q:'The two vessels that break the oxygen rule',a:'Pulmonary artery (deoxygenated, RV→lungs) and pulmonary vein (oxygenated, lungs→LA).'},

quiz:[
{q:'Which chamber receives deoxygenated blood from the body?',o:['Right ventricle','Right atrium','Left atrium','Left ventricle'],a:1,e:'Vena cava → right atrium. The right ventricle then pumps it on to the lungs.'},
{q:'Which chambers have the thicker muscular walls?',o:['Atria','Ventricles','Both equally','Neither'],a:1,e:'Ventricles do the pumping. The left ventricle is thickest of all — it serves the whole body.'},
{q:'Which structure prevents blood flowing backwards?',o:['Atria','Ventricles','Valves','Arteries'],a:2,e:'Valves — "doors that only open one way" — ensure unidirectional flow.'},
{q:'Which vessel carries oxygenated blood back from the lungs?',o:['Aorta','Pulmonary artery','Vena cava','Pulmonary vein'],a:3,e:'The pulmonary vein — the only vein carrying oxygenated blood. The pulmonary artery is the mirror-image exception.'},
{q:'The pulmonary artery carries…',o:['oxygen-rich blood to the body','deoxygenated blood to the lungs','oxygenated blood to the lungs','deoxygenated blood to the body'],a:1,e:'Right ventricle → lungs, deoxygenated. "Artery" only means AWAY from the heart.'},
{q:'Veins have valves because…',o:['they carry oxygenated blood','blood pressure in them is low','they are near the heart','they have thick muscular walls'],a:1,e:'Low pressure means blood could pool or flow backwards; valves prevent that. Arteries don\'t need them — the pressure keeps blood moving forward.'},
{q:'Which vessel performs material exchange with tissues?',o:['Capillaries','Arteries','Veins','Aorta'],a:0,e:'Capillaries: one cell wide, one-cell-thick walls, slow flow — built for exchange.'},
{q:'"Lub-dub" is caused by…',o:['blood rushing through the aorta','valves closing','muscles contracting','the diaphragm moving'],a:1,e:'AV valves close ("lub"), then semilunar valves close ("dub").'},
{q:'Compared with arteries, capillaries have…',o:['thicker walls and higher pressure','one-cell-thick walls and a very narrow lumen','valves and a wide lumen','the same structure as veins'],a:1,e:'Thin + narrow = short diffusion distance and slow flow → maximum exchange.'},
