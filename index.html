bank:[
{cmd:'State',t:'Heart',d:1,q:'Name the four chambers of the heart and state the function of each.',a:'Right atrium: receives deoxygenated blood from the body via the vena cava. Right ventricle: pumps deoxygenated blood to the lungs via the pulmonary artery. Left atrium: receives oxygenated blood from the lungs via the pulmonary vein. Left ventricle: pumps oxygenated blood to the whole body via the aorta.'},
{cmd:'Outline',t:'Blood flow',d:2,q:'Trace the path of blood from the body, through the heart and lungs, and back to the body.',a:'Body → vena cava → right atrium → AV valve → right ventricle → pulmonary valve → pulmonary artery → lung capillaries (CO₂ out, O₂ in) → pulmonary vein → left atrium → AV valve → left ventricle → aortic valve → aorta → arteries/arterioles → body capillaries (O₂ out, CO₂ in) → venules/veins → vena cava → repeat.'},
{cmd:'Compare',t:'Vessels',d:2,q:'Compare arteries, veins and capillaries in structure and function.',a:'Arteries: away from heart, high pressure, thick muscular walls, narrow lumen, no valves, carry the pulse. Veins: back to heart, low pressure, thin walls, wide lumen, valves to prevent backflow. Capillaries: one cell wide with one-cell-thick walls, no valves, low pressure and slow flow — where exchange with tissues happens. Note the pulmonary artery/vein exceptions to the oxygen rule.'},
{cmd:'Explain',t:'Heart',d:2,q:'Explain why the left ventricle has a thicker muscular wall than the right ventricle.',a:'The left ventricle must pump blood to the entire body through the systemic circuit, generating enough pressure to overcome the high resistance of the whole-body network. The right ventricle only pumps blood the short distance to the lungs, where resistance is low, so it needs thinner muscle.'},
{cmd:'Explain',t:'Integration',d:2,q:'Explain how the cardiovascular system maintains the concentration gradients needed for gas exchange.',a:'At the alveoli, blood arriving is low in O₂ and high in CO₂; it diffuses O₂ in / CO₂ out and then flows on, replaced by fresh deoxygenated blood. At body tissues the reverse. Because blood keeps moving, the high and low concentrations on each side of the exchange surface never equalise — diffusion continues. Without circulation, the gradients collapse and gas exchange stops.'},
{cmd:'Describe',t:'Practical',d:2,q:'Describe what happens to your pulse rate during and after exercise, and explain why.',a:'Pulse rate rises sharply within the first minutes of exercise and stays elevated while exercise continues, then falls gradually during recovery. It rises because muscles respire faster to release ATP for contraction: they need more O₂ and glucose delivered per minute and more CO₂ removed, so the heart pumps faster to raise the rate of blood flow.'},
{cmd:'Explain',t:'Blood pressure',d:2,q:'Explain what the two numbers in a blood pressure reading of 120/80 mmHg mean, and why hypertension is dangerous.',a:'120 mmHg is the systolic pressure — the maximum pressure in the arteries when the ventricles contract. 80 mmHg is the diastolic pressure — the pressure when the heart relaxes between beats. Hypertension is dangerous because persistently high pressure damages artery walls, accelerates fatty deposit formation, strains the heart, and raises the risk of heart attack and stroke.'},
{cmd:'Evaluate',t:'Data',d:3,q:'A student measures heart rate every minute during a 5-minute run: 72, 98, 120, 128, 128, 130 bpm. Evaluate the conclusion that "heart rate keeps rising as long as exercise continues."',a:'Supported over most of the run: the rate rises from 72 to around 128 over four minutes and then flattens — consistent with increased demand for O₂ and CO₂ removal as muscles respire faster. Not supported without limit: the plateau at 128–130 suggests a maximum is being reached, and heart rate falls once exercise stops. Limitations: only one student, no repeated trials, no control of intensity, and no recovery data — so the "keeps rising" claim is only supported early in exercise, not indefinitely.'},
{cmd:'Describe',t:'Conditions',d:2,q:'Describe two risk factors for coronary heart disease and explain the mechanism by which each increases risk.',a:'Smoking: damages the lining of arteries and reduces oxygen carrying capacity, accelerating fatty deposits in coronary arteries which narrow them and reduce O₂ supply to heart muscle. High-fat diet: raises blood cholesterol, which builds up as atheroma in the coronary arteries, narrowing the lumen so less blood (and O₂) reaches the heart — causing angina and, if a clot blocks the artery, a heart attack.'},
{cmd:'Compare',t:'Systems',d:3,q:'Compare the human circulatory system with the transport system in a plant.',a:'Both move materials around the organism in specialised tubes. Differences: the circulatory system has a pump (the heart) and carries blood in a closed loop of arteries/veins/capillaries, moving O₂, CO₂, glucose, urea and hormones in two directions at once. Xylem moves water and minerals one way only (roots → leaves) using transpiration pull, no pump; phloem moves sucrose and amino acids from sources to sinks. Blood contains living cells and is pumped; xylem vessels are dead hollow tubes.'}
]},
plant:{id:'plant',name:'Plant Systems',short:'Plant systems',color:'#15803d',icon:'🌿',
blurb:'How a plant with no heart moves water, sugar and gases — xylem, phloem, and the leaf as a factory.',
notes:`<h4>1 · A plant is a system</h4>
<table>
<tr><th>Inputs</th><th>Processes</th><th>Outputs</th></tr>
<tr><td>CO₂ (air) · water (roots) · mineral nutrients (roots) · sunlight · heat</td><td>Photosynthesis (chloroplasts) · cellular respiration (mitochondria) · transpiration (leaves)</td><td>O₂ · glucose/starch · heat · leaf litter; matter built: amino acids, starch, glucose, lignin</td></tr>
</table>
<p>No pump, no lungs, no blood — but the same three jobs as the animal systems you just studied: <b>supply cells with raw materials, remove waste, and move products from where they're made to where they're stored or used.</b></p>

<h4>2 · The two transport tissues</h4>
<div class="grid g2">
<div class="card"><b>Xylem — water up</b><ul>
<li>Carries <b>water and dissolved mineral salts</b> from roots to the rest of the plant</li>
<li>Movement = <b>transpiration</b>, in <b>one direction only</b> (roots → leaves)</li>
<li>Made of <b>dead, hollow cells</b> strengthened with <b>lignin</b> — the water column can be pulled under tension without the tubes collapsing</li>
<li>In the root it forms a central support column; in the stem it sits in vascular bundles; in the leaf it branches as veins</li>
</ul></div>
<div class="card"><b>Phloem — sugar around</b><ul>
<li>Carries <b>sucrose and amino acids</b> between leaves and the rest of the plant</li>
<li>Movement = <b>translocation</b> — can go <b>up or down</b> depending on demand</li>
<li>Made of <b>living cells</b> end to end, with cytoplasm flowing through pores between cells</li>
<li>Moves from <b>sources</b> (where sugar is made or released, e.g. leaves in summer) to <b>sinks</b> (where it's stored or used, e.g. roots, fruits, seeds)</li>
</ul></div>
</div>
<div class="callout tip"><b>"Plants have no pump — how does water get to the top of a tree?"</b> The engine is <b>transpiration pull</b>: water evaporates from the leaf surfaces through the stomata, and that evaporation tugs on the continuous column of water in the xylem. Because water molecules stick together (cohesion) and to the xylem walls, pulling the top of the column drags the whole column up from the roots. No energy spent by the plant, no pump — just evaporation creating the pull.</div>
<p><b>Factors that change the rate of transpiration</b> (extension, but it's the same logic as any diffusion rate): higher temperature, higher light intensity (stomata open), lower humidity, and more wind all increase the rate — each one steepens the concentration gradient for water vapour between the leaf's air spaces and the outside air.</p>

<h4>3 · Organisation: cell → tissue → organ → system</h4>
<p><b>Tissue</b> = a group of similar cells working together for a particular function. <b>Organ</b> = a group of tissues working together for a particular function (a leaf is an organ). The <b>leaf</b> is the main organ of <b>photosynthesis</b> and a site of <b>gas exchange</b>.</p>

<h4>4 · The leaf outside and inside</h4>
<p><b>External parts:</b> the <b>midrib</b> gives strength and carries the vascular tissue · the <b>edge</b> gives the leaf a large surface area to catch sunlight · the <b>petiole</b> attaches the leaf to the stem · the <b>veins</b> are the visible branches of xylem and phloem.</p>
<svg viewBox="0 0 680 240" style="width:100%;height:auto;display:block" role="img" aria-label="Leaf cross-section">
<defs><marker id="al1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0369a1"/></marker></defs>
<g font-size="12" fill="#17203a">
<path d="M 60 50 Q 340 30 620 50 L 620 62 Q 340 44 60 62 Z" fill="#dcfce7" stroke="#15803d"/>
<text x="340" y="42" text-anchor="middle" font-size="11.5">waxy cuticle + upper epidermis (transparent, waterproof)</text>
<rect x="120" y="66" width="440" height="46" rx="4" fill="#bbf7d0" stroke="#15803d"/>
<text x="340" y="94" text-anchor="middle" font-size="11.5">PALISADE MESOPHYLL — packed with chloroplasts, main site of photosynthesis</text>
<rect x="120" y="118" width="440" height="56" rx="4" fill="#f0fdf4" stroke="#15803d"/>
<text x="150" y="140" font-size="11.5">SPONGY MESOPHYLL — air spaces,</text>
<text x="150" y="154" font-size="11.5">some photosynthesis, gas circulates</text>
<circle cx="250" cy="160" r="5" fill="#94a3b8"/><circle cx="300" cy="145" r="5" fill="#94a3b8"/><circle cx="330" cy="165" r="5" fill="#94a3b8"/><circle cx="380" cy="150" r="5" fill="#94a3b8"/><circle cx="420" cy="162" r="5" fill="#94a3b8"/>
<text x="450" y="146" font-size="11.5">air spaces</text>
<path d="M 340 62 L 340 200" stroke="#b45309" stroke-width="2"/><path d="M 330 170 L 340 200 L 350 170" fill="#b45309"/>
<text x="360" y="196" font-size="11.5" fill="#b45309">vascular bundle (xylem + phloem)</text>
<path d="M 60 182 Q 340 200 620 182 L 620 194 Q 340 214 60 194 Z" fill="#fee2e2" stroke="#be1239"/>
<text x="340" y="208" text-anchor="middle" font-size="11.5">lower epidermis with stomata</text>
<g>
<path d="M 200 186 q 10 -16 20 0 q -10 8 -20 0" fill="#22c55e" stroke="#15803d"/>
<text x="210" y="232" text-anchor="middle" font-size="11">stoma (open)</text>
<line x1="235" y1="222" x2="210" y2="196" stroke="#5b6478" stroke-width="1"/>
<path d="M 470 186 q 8 -4 16 0 q -8 6 -16 0" fill="#86efac" stroke="#15803d"/>
<text x="478" y="232" text-anchor="middle" font-size="11">stoma (closing)</text>
</g>
<text x="80" y="112" font-size="11.5">thin leaf =</text><text x="80" y="126" font-size="11.5">short diffusion</text><text x="80" y="140" font-size="11.5">path for CO₂</text>
</g></svg>
<p class="figcap">Label any of these parts and give its function — the palisade/spongy/guard-cell trio is the guaranteed exam content.</p>
<h4>5 · Every tissue, one function</h4>
<table>
<tr><th>Tissue / structure</th><th>Function</th></tr>
<tr><td><b>Upper epidermis</b></td><td>Protective layer; transparent so sunlight reaches the palisade layer</td></tr>
<tr><td><b>Waxy cuticle</b></td><td>Waterproof coating that reduces water loss by evaporation, thin enough to let light through</td></tr>
<tr><td><b>Palisade mesophyll</b></td><td>Cells packed with chloroplasts — the site of most photosynthesis; positioned at the top to catch light</td></tr>
<tr><td><b>Spongy mesophyll</b></td><td>Air spaces for gas exchange; some photosynthesis also occurs here</td></tr>
<tr><td><b>Guard cells</b></td><td>Open and close the stoma to let CO₂ in and O₂ out, and to limit water loss</td></tr>
<tr><td><b>Stomata (stoma singular)</b></td><td>Pores, mostly on the lower surface, for gas exchange</td></tr>
<tr><td><b>Vascular bundle / vein</b></td><td>Xylem + phloem; transports water in and sugar out; supports the leaf</td></tr>
</table>
<h4>6 · Stomata — how the pore actually opens</h4>
<p>Two guard cells wrap around each stoma. <b>In light</b>: guard cells photosynthesise, sugar concentration rises, water enters by osmosis, the cells swell and become <b>turgid</b> — the thin outer walls bulge outward and the pore <b>opens</b>, letting CO₂ in for photosynthesis. <b>In darkness or drought</b>: guard cells lose water, become <b>flaccid</b>, and the pore <b>closes</b>, conserving water at the cost of gas exchange.</p>
<div class="callout tip"><b>"Do all plant cells have chloroplasts?" — No.</b> Root cells are underground with no light, and xylem cells are dead hollow tubes; neither photosynthesises. Justify with the function: photosynthesis requires light and chlorophyll, so only light-exposed cells (mainly leaf mesophyll) carry them.</div>
<h4>7 · Plant transport vs human transport (the compare question)</h4>
<table>
<tr><th></th><th>Plant</th><th>Human</th></tr>
<tr><td><b>Pump?</b></td><td>No pump — transpiration pull (xylem); pressure flow (phloem)</td><td>The heart, continuously, in a closed loop</td></tr>
<tr><td><b>What moves</b></td><td>Water + minerals (xylem, one way); sucrose + amino acids (phloem, source→sink)</td><td>Blood — O₂, CO₂, glucose, urea, hormones</td></tr>
<tr><td><b>Tubes</b></td><td>Dead hollow lignified vessels (xylem) / living cells (phloem)</td><td>Arteries, veins, capillaries with muscular walls and valves</td></tr>
<tr><td><b>Direction</b></td><td>Xylem up only; phloem both ways</td><td>Both ways simultaneously in the two circulations</td></tr>
<tr><td><b>Gas exchange</b></td><td>Stomata — diffusion only, no ventilation</td><td>Alveoli with active ventilation</td></tr>
</table>`,
cards:[
{q:'Xylem: what and which direction?',a:'Water and mineral salts, roots → leaves, one direction only. Movement = transpiration. Dead lignified cells.'},
{q:'Phloem: what and which direction?',a:'Sucrose and amino acids from sources (leaves) to sinks (roots, fruits). Living cells. Movement = translocation, can go both ways.'},
{q:'How does water reach the top of a tree with no pump?',a:'Transpiration pull: evaporation from leaves tugs the whole water column up the xylem (cohesion + adhesion); lignin stops the tubes collapsing.'},
{q:'Source vs sink',a:'Source = where sucrose is made or released (mature leaves). Sink = where it is stored or used (roots, seeds, fruits).'},
{q:'Five leaf tissues and functions',a:'Upper epidermis (protection, transparent); waxy cuticle (less water loss); palisade mesophyll (most chloroplasts — main photosynthesis); spongy mesophyll (air spaces, gas exchange); guard cells (open/close stomata).'},
{q:'Which leaf layer has the most chloroplasts, and why there?',a:'Palisade mesophyll — packed with chloroplasts and positioned at the top, closest to the incoming light.'},
{q:'Why is a leaf thin and broad?',a:'Thin = short diffusion distance for CO₂. Broad = large surface area to catch sunlight.'},
{q:'How do stomata open and close?',a:'Guard cells: turgid (full of water, in light) → pore opens; flaccid → pore closes. Controls CO₂ intake vs water loss.'},
{q:'Why don\'t root cells have chloroplasts?',a:'No light underground — photosynthesis requires light and chlorophyll, so only light-exposed cells make them.'},
{q:'Four external leaf parts',a:'Midrib (support + transport), edge (large surface area), petiole (attach to stem), veins (xylem + phloem branches).'},
{q:'Xylem in root vs stem arrangement',a:'Root: xylem forms a central column (support). Stem: xylem and phloem grouped in vascular bundles.'},
{q:'Plant vs human transport: the pump difference',a:'Plants have no pump — transpiration pull moves water up xylem; the human heart actively pumps blood round a closed loop.'},
{q:'What four things increase transpiration rate?',a:'More light (stomata open), higher temperature, lower humidity, more wind — all steepen the water-vapour gradient.'},
{q:'Leaf as an organ',a:'A group of tissues (epidermis, mesophyll, vascular) working together for photosynthesis and gas exchange.'}
],

{q:'Water reaches the top of a tall tree mainly because of…',o:['a pump in the roots','transpiration pull from the leaves','the phloem pushing it','root pressure alone'],a:1,e:'Evaporation from the leaves tugs the continuous water column up the xylem — no pump needed.'},

{q:'Why do root cells lack chloroplasts?',o:['they are dead','there is no light, and photosynthesis needs light','they store too much water','they are too small'],a:1,e:'No light underground → no photosynthesis → no chloroplasts needed.'},
{q:'Air spaces in the spongy mesophyll are important because they…',o:['store starch','allow gases to circulate for exchange','transport water up','reflect sunlight'],a:1,e:'The air spaces let CO₂ reach the photosynthesising cells and O₂ escape toward the stomata.'}

bank:[
{cmd:'State',t:'Transport',d:1,q:'State the functions of xylem and phloem.',a:'Xylem transports water and dissolved mineral salts from the roots up to the rest of the plant (one direction, via transpiration). Phloem transports sucrose and amino acids between sources (where they are made, e.g. leaves) and sinks (where they are stored or used), in both directions.'},
{cmd:'Outline',t:'Transport',d:2,q:'Explain how water moves from the roots to the leaves of a tall plant without a pumping organ.',a:'Water evaporates from the leaf cell surfaces and diffuses out through the stomata (transpiration). This evaporation pulls on the continuous column of water in the xylem; because water molecules cohere to each other and adhere to the xylem walls, the pull is transmitted all the way down to the roots, drawing water up through the lignified tubes.'},
{cmd:'Describe',t:'Leaf',d:2,q:'Describe how the internal structure of a leaf is adapted for photosynthesis.',a:'Thin overall = short diffusion distance for CO₂. Broad shape and transparent upper epidermis let in maximum light. Palisade mesophyll at the top is packed with chloroplasts, the main photosynthetic tissue. Spongy mesophyll has air spaces so CO₂ can circulate to the cells and O₂ escape. Stomata (controlled by guard cells) allow gas exchange while limiting water loss. The vascular bundle supplies water and removes dissolved sugar, and the midrib supports the leaf.'},
{cmd:'Compare',t:'Transport',d:2,q:'Compare xylem and phloem in structure and function.',a:'Xylem: water + minerals, one direction (roots → leaves), made of dead hollow cells with lignin, movement by transpiration pull. Phloem: sucrose + amino acids, both directions (source → sink), made of living cells with cytoplasm flowing between them, movement by translocation. Both are vascular tissues found together in bundles/veins, but they carry different substances in different directions.'},
{cmd:'Explain',t:'Stomata',d:2,q:'Explain how guard cells control the opening of stomata and why this matters for the plant.',a:'In light, guard cells photosynthesise, sugar concentration rises, water enters by osmosis and the cells become turgid; the thin outer walls bulge and the stoma opens — letting CO₂ in for photosynthesis. At night or under drought stress, guard cells lose water, become flaccid and the stoma closes — conserving water but stopping gas exchange. This trade-off lets the plant balance photosynthesis against water loss.'},
{cmd:'Describe',t:'Tissues',d:1,q:'Describe the function of any four leaf tissues.',a:'Upper epidermis: protection, transparent to light. Waxy cuticle: waterproofing to reduce water loss. Palisade mesophyll: main site of photosynthesis, packed with chloroplasts. Spongy mesophyll: air spaces for gas exchange plus some photosynthesis. Guard cells: control the stoma. (Any four.)'},
{cmd:'Explain',t:'Integration',d:2,q:'A plant is kept in darkness for 48 hours. Predict and explain what happens to its stomata and its sugar transport.',a:'Stomata stay mostly closed (guard cells become flaccid without light-driven sugar accumulation) so little CO₂ enters; photosynthesis stops and oxygen output falls. With no new sugar being produced, translocation slows because there is no source output moving to sinks; stored starch is broken down and glucose is respired in the mitochondria for energy instead of accumulating.'},
{cmd:'Evaluate',t:'Data',d:3,q:'A student covers one leaf of a plant with aluminium foil for three days, then tests both leaves for starch with iodine. The covered leaf stays yellow-brown; the uncovered leaf turns blue-black. Evaluate the conclusion that light is necessary for photosynthesis.',a:'Supported: the uncovered leaf produced starch (blue-black with iodine = starch present) while the foil-covered leaf produced none, and the only deliberate difference was light — so light appears necessary for photosynthesis. The iodine test is valid because starch is the storage product of photosynthesis. Limitations: only one leaf per condition and no repeats makes the result vulnerable to individual variation; heat-killing in boiling alcohol must be done identically or the test is unreliable; and "necessary" should be qualified — the test shows light is necessary for starch production in these conditions, not for photosynthesis in all circumstances (e.g., brief light exposure still makes starch).'},
{cmd:'Design',t:'Practical',d:3,q:'Design an experiment to test whether light intensity affects the rate of photosynthesis.',a:'IV = light intensity (lamp at different distances from the pondweed, e.g. 10–100 cm; intensity falls with distance). DV = rate of photosynthesis, measured as the number of O₂ bubbles counted per minute (or gas volume collected over time). CVs = same piece of pondweed, same volume/temperature of water (leave to equilibrate), same sodium hydrogencarbonate concentration (CO₂ supply), same acclimatisation time before counting. Hypothesis: rate increases as light intensity increases, then plateaus when all available chlorophyll is saturated with light. Method: set lamp distance, leave 2 minutes to adjust, count bubbles for 1 minute, repeat 3× and average, plot rate against 1/distance². Safety: keep electrical equipment away from water.'},
{cmd:'Compare',t:'Systems',d:3,q:'Compare gas exchange in a leaf with gas exchange in a human lung.',a:'Both rely on diffusion across thin, large-surface-area, moist surfaces maintained by a concentration gradient. Differences: the lung actively ventilates (diaphragm + ribs move air); the leaf has no ventilation — gases diffuse passively through stomata, moved only by wind. The lung exchanges gas between air and blood (alveoli → capillaries); the leaf exchanges directly with photosynthesising cells (stomata → air spaces → cells). Oxygen and CO₂ travel in opposite directions in both systems, but in the leaf the net direction of each gas flips between light (photosynthesis dominates: CO₂ in, O₂ out) and darkness (respiration dominates: O₂ in, CO₂ out), whereas the human lung direction never changes.'}
]},
photo:{id:'photo',name:'Photosynthesis',short:'Photosynthesis',color:'#b45309',icon:'☀️',
blurb:'The equation, the two stages, chlorophyll and colour, and the three limiting-factor graphs that carry the marks.',
notes:`<h4>1 · The reaction</h4>
<div class="eq">word: carbon dioxide + water → glucose + oxygen&nbsp;&nbsp;(light energy, chlorophyll)<br>symbol: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂</div>
<p><b>Where it happens:</b> the <b>chloroplasts</b>, which are packed with the green pigment <b>chlorophyll</b>. Chlorophyll absorbs sunlight (red and blue light especially) and converts it into chemical energy. <b>Green light is reflected</b>, which is why plants look green.</p>
<p><b>Where a plant's mass comes from</b> — mostly from <b>CO₂ taken in from the air</b>, plus water, not from the soil. Photosynthesis builds glucose out of air and water; that glucose becomes starch, cellulose, amino acids and everything else the plant is made of.</p>
<div class="callout tip"><b>Why plants have BOTH mitochondria and chloroplasts:</b> chloroplasts photosynthesise — but only in light. Mitochondria respire, releasing ATP for the cell — and they do it <b>all the time, day and night</b>. In darkness a plant is a net <b>consumer</b> of O₂ and producer of CO₂; in bright light a net producer of O₂. A plant runs both pathways simultaneously.</div>

<h4>2 · Two stages</h4>
<table>
<tr><th>Light-dependent stage</th><th>Light-independent stage</th></tr>
<tr><td>Requires light. Chlorophyll absorbs light energy; the energy splits <b>water</b> by <b>photolysis</b> — oxygen is released as a by-product. Energy is captured in ATP and electron carriers.</td><td>Doesn't need light directly. Uses the ATP from stage one to fix <b>CO₂</b> into carbohydrate (glucose, then starch).</td></tr>
<tr><td colspan="2" class="muted">Key trap: the O₂ released by photosynthesis comes from <b>water</b>, not from CO₂. The CO₂ supplies the carbon skeleton of the glucose.</td></tr>
</table>

<h4>3 · Limiting factors — the three graphs</h4>
<p>A <b>limiting factor</b> is whichever factor is holding the rate down at that moment; raise it and the rate rises until a <i>different</i> factor becomes limiting. Same logic as enzyme substrate-concentration curves — photosynthesis is enzyme-controlled.</p>
<svg viewBox="0 0 680 200" style="width:100%;height:auto;display:block" role="img" aria-label="Limiting factor graphs">
<g font-size="11.5" fill="#17203a">
<g transform="translate(10,20)">
<line x1="20" y1="120" x2="190" y2="120" stroke="#94a3b8"/><line x1="20" y1="20" x2="20" y2="120" stroke="#94a3b8"/>

<p class="figcap">Be able to sketch and annotate all three from memory.</p>
<table>
<tr><th>Factor</th><th>Why rate rises</th><th>Why it stops / falls</th></tr>
<tr><td><b>Light intensity</b></td><td>More light → more chlorophyll molecules are photo-activated → faster light-dependent stage</td><td><b>Plateau:</b> all available chlorophyll are saturated with light</td></tr>
<tr><td><b>CO₂ concentration</b></td><td>More CO₂ fixed into organic molecules in the light-independent stage</td><td><b>Plateau:</b> the carbon-fixation enzymes are saturated — every active site occupied</td></tr>
<tr><td><b>Temperature</b></td><td>More kinetic energy → more enzyme–substrate collisions → faster reactions</td><td><b>Falls above the optimum:</b> the enzymes denature (active site changes shape); fully denatured = no reaction</td></tr>
</table>
<p>Also worth knowing: <b>different wavelengths</b> affect the rate — green light is reflected so it gives the lowest rate; red/blue give the highest.</p>

<h4>4 · Measuring the rate in a practical</h4>
<ul>
<li><b>Count O₂ bubbles</b> from pondweed per minute (or collect gas in a capillary tube / measure volume).</li>
<li><b>Algal balls + hydrogencarbonate indicator</b> — the indicator changes colour as CO₂ is used; faster change = faster photosynthesis.</li>
<li><b>Why count bubbles?</b> Bubbles are oxygen — a visible proxy for the rate of the light-dependent stage.</li>
<li><b>Designing the test of one factor:</b> IV = that factor (e.g. lamp distance, or bicarbonate concentration); DV = rate (bubbles/min or indicator change); CVs = temperature, same pondweed, same solution volume, settling time; hypothesis must include scientific reasoning <i>and</i> a sketch graph.</li>
</ul>
<div class="callout tip"><b>Greenhouse application:</b> "Tomato plants grow faster when temperature is raised" → temperature was <b>the limiting factor</b> — raising a limiting factor raises the rate. But take it too far and the rate falls (enzymes denature). Glasshouses exploit exactly this by warming, adding CO₂ and lighting crops.</div>

<h4>5 · Photosynthesis vs respiration (guaranteed compare)</h5>
<table>
<tr><th></th><th>Photosynthesis</th><th>Respiration</th></tr>
<tr><td><b>Equation</b></td><td>CO₂ + H₂O → glucose + O₂</td><td>glucose + O₂ → CO₂ + H₂O (+ ATP)</td></tr>
<tr><td><b>Where</b></td><td>Chloroplasts (cells with chlorophyll)</td><td>Mitochondria (<b>all</b> living cells)</td></tr>
<tr><td><b>When</b></td><td>Only in light</td><td><b>All the time</b></td></tr>
<tr><td><b>Energy</b></td><td><b>Stores</b> light energy in glucose</td><td><b>Releases</b> energy from glucose as ATP</td></tr>
<tr><td><b>Net gases</b></td><td>Takes in CO₂, releases O₂</td><td>Takes in O₂, releases CO₂</td></tr>
</table>`,

bank:[
{cmd:'State',t:'Equations',d:1,q:'State the word and symbol equations for photosynthesis, and name the site and pigment.',a:'carbon dioxide + water → glucose + oxygen. 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂. Site: chloroplasts. Pigment: chlorophyll.'},
{cmd:'Outline',t:'Chlorophyll',d:1,q:'Outline the role of chlorophyll in photosynthesis.',a:'Chlorophyll is the green pigment packed into the chloroplasts. It absorbs light energy (mainly red and blue; green is reflected) and converts it into chemical energy that drives the light-dependent stage of photosynthesis.'},
{cmd:'Describe',t:'Limiting factors',d:2,q:'Identify and describe the limiting factors of photosynthesis, sketching the shape of each graph.',a:'(1) Light intensity: rate rises then plateaus when all chlorophyll is saturated with light. (2) CO₂ concentration: rate rises then plateaus when the carbon-fixation enzymes are saturated. (3) Temperature: rate rises to an optimum then falls as the enzymes denature above it. All three graphs plateau or peak because a different factor becomes limiting once one is no longer scarce.'},
{cmd:'Explain',t:'Data',d:2,q:'A greenhouse tomato grower increases the temperature and the crop grows faster. Explain what this shows, and warn the grower of its limit.',a:'It shows temperature was the limiting factor — raising a limiting factor raises the rate of photosynthesis, so more glucose is produced and growth speeds up. The limit: above the optimum the controlling enzymes denature, so the rate falls; and once temperature is no longer limiting, only adding more light or CO₂ will raise the rate further.'},
{cmd:'Explain',t:'Practical',d:2,q:'In an investigation into photosynthesis in a water plant, why is the number of bubbles of gas counted?',a:'Bubbles are oxygen, the product of the light-dependent stage. Counting them per unit time gives a measurable proxy for the rate of photosynthesis — more bubbles in the same time = a higher rate. (Caveat: assumes bubble size is roughly constant, so volume of gas collected is more accurate.)'},
{cmd:'Compare',t:'Processes',d:2,q:'Compare photosynthesis and cellular respiration.',a:'They are near-opposite processes. Photosynthesis (chloroplasts, only in light) stores light energy: CO₂ + H₂O → glucose + O₂. Respiration (mitochondria, all living cells, all the time) releases energy: glucose + O₂ → CO₂ + H₂O + ATP. Plants do both simultaneously; in light photosynthesis exceeds respiration so the plant is a net O₂ producer, in darkness only respiration occurs.'},
{cmd:'Explain',t:'Processes',d:2,q:'Explain why plants respire as well as photosynthesise, given that photosynthesis makes glucose.',a:'Glucose stores energy but cannot power cell processes directly. Respiration releases that stored energy as ATP, which cells use for active transport, protein synthesis, cell division and other life processes. Photosynthesis stops in darkness but cells still need ATP 24/7, so plants respire continuously — at night they take in O₂ and release CO₂ like animals.'},
{cmd:'Evaluate',t:'Data',d:3,q:'A student times how long pH indicator takes to change colour in algal balls: at 100% light the change took 4 min, at 50% light 9 min, in darkness no change after 20 min. Evaluate the conclusion that "the rate of photosynthesis is directly proportional to light intensity."',a:'Supported qualitatively: stronger light → faster indicator change → the rate of photosynthesis is higher, consistent with more chlorophyll being photo-activated. Not supported as "directly proportional": halving the light roughly halved the rate (4 → 9 min is more than 2×), but at darkness the rate fell to zero — not a straight-line relationship — and with no light the indicator change may also reflect respiration acidifying the medium. Limitations: timing is imprecise, only one set of balls per condition, no temperature control of the water, and indicator colour change is qualitative. The data support "rate increases with light intensity up to saturation", not direct proportionality.'},
{cmd:'Design',t:'Practical',d:3,q:'Design a practical to test the effect of CO₂ concentration on the rate of photosynthesis.',a:'IV = CO₂ concentration, set by sodium hydrogencarbonate solution at different concentrations (e.g. 0.1–1.0% in 0.1% steps). DV = rate, measured by counting O₂ bubbles from a fixed piece of pondweed for 1 minute, or by timing indicator colour change in algal balls. CVs = light intensity (fixed lamp distance), temperature (equilibration), same plant material, same solution volume. Hypothesis: rate increases with CO₂ because more carbon fixation occurs, then plateaus when the fixation enzymes are saturated. Method: assemble apparatus, let it settle 2 min, count bubbles 3× per concentration, average, plot. Safety: hot lamps away from water; handle indicators per CLEAPSS guidance.'},
{cmd:'Explain',t:'Application',d:3,q:'Explain how a commercial glasshouse maximises the rate of photosynthesis using all three limiting factors.',a:'Light: banks of lamps extend daylight and raise light intensity until chlorophyll saturates. CO₂: bottled CO₂ is released to raise concentration above atmospheric — carbon fixation speeds up until the fixation enzymes saturate. Temperature: heaters and vents hold the temperature near the optimum — high enough for fast enzyme action, low enough to avoid denaturation. Managing all three means none of them is the limiting factor, so the rate stays maximal — but each has a ceiling, and pushing any one past its optimum wastes money and (for temperature) lowers the rate.'}
]},

blurb:'How food becomes molecules cells can use, and the protein machines that do it — mechanism, specificity, and the three factors that control the rate.',
notes:`<h4>1 · Two kinds of digestion</h4>
<table>
<tr><th>Mechanical digestion</th><th>Chemical digestion</th></tr>
<tr><td>Physical breakdown — teeth tearing and grinding, the stomach churning. No bonds broken. Its job is to <b>increase surface area</b> for enzymes to attack.</td><td>Enzymes break large, insoluble molecules into small, <b>soluble</b> molecules that can cross the gut wall into the blood.</td></tr>
</table>
<p><b>The digestion tour:</b> mouth (salivary amylase starts starch → maltose) → oesophagus (peristalsis) → stomach (HCl + pepsin; churning) → small intestine (bile emulsifies fat, pancreatic amylase/trypsin/lipase finish the job) → large intestine (water absorption). Glucose and amino acids diffuse/are transported into the blood; fatty acids and glycerol enter the lymph.</p>

<h4>2 · HCl and bile</h4>
<ul>
<li><b>Hydrochloric acid (stomach):</b> kills harmful microorganisms in food and provides the strongly acidic pH (~2) at which the protease pepsin works — it also helps denature proteins so enzymes can reach their bonds.</li>
<li><b>Bile (made in the liver, stored in the gallbladder, released into the small intestine):</b> <b>emulsifies</b> fat — breaks large fat droplets into many tiny ones, massively increasing surface area for lipase; and <b>neutralises</b> the stomach acid so small-intestine enzymes can work.</li>
</ul>

<h4>3 · Enzymes: definition and properties</h4>
<p>An <b>enzyme is a biological catalyst</b> — almost always a <b>protein</b> — that speeds up a reaction without being used up, so it can be reused. Each enzyme has an <b>active site</b> with a shape complementary to its specific <b>substrate</b>: specificity works because only the right substrate fits.</p>
<div class="callout tip"><b>Why reusable + why specific in one answer:</b> the enzyme binds the substrate, catalyses the reaction, releases the <b>product</b>, and returns to its original state — ready for the next substrate molecule. The reused-enzyme property is why tiny quantities can catalyse enormous amounts of substrate.</div>

<h4>4 · Lock &amp; key vs induced fit</h4>
<table>
<tr><th>Lock and key</th><th>Induced fit (accepted model)</th></tr>
<tr><td>The active site is a rigid, exact complement of the substrate.</td><td>The active site is flexible and <b>moulds around</b> the substrate when it binds.</td></tr>
<tr><td>Great at explaining specificity.</td><td>Explains specificity <b>and</b> catalysis: the moulding strains the substrate's bonds (lowers the energy needed to react) and explains how related molecules can bind.</td></tr>
</table>
<p>Either way, <b>denaturation</b> breaks everything: high temperature or extreme pH changes the enzyme's 3-D shape, the active site no longer fits the substrate, and the reaction stops. Denaturation is usually irreversible.</p>

<h4>5 · The three factors that control enzyme rate</h4>
<svg viewBox="0 0 680 170" style="width:100%;height:auto;display:block" role="img" aria-label="Enzyme rate graphs">
<g font-size="11.5" fill="#17203a">
<g transform="translate(10,15)">
<line x1="20" y1="105" x2="185" y2="105" stroke="#94a3b8"/><line x1="20" y1="15" x2="20" y2="105" stroke="#94a3b8"/>
<path d="M 22 103 Q 90 20 105 20 Q 122 20 150 103" fill="none" stroke="#be1239" stroke-width="2.4"/>
<text x="102" y="128" text-anchor="middle">temperature</text><text x="102" y="145" text-anchor="middle" fill="#5b6478">bell curve + denaturation</text><text x="102" y="46" text-anchor="middle" fill="#5b6478">rate</text>
</g>
<g transform="translate(240,15)">
<line x1="20" y1="105" x2="185" y2="105" stroke="#94a3b8"/><line x1="20" y1="15" x2="20" y2="105" stroke="#94a3b8"/>
<path d="M 22 103 Q 90 20 105 20 Q 122 20 150 103" fill="none" stroke="#6d28d9" stroke-width="2.4"/>
<text x="102" y="128" text-anchor="middle">pH</text><text x="102" y="145" text-anchor="middle" fill="#5b6478">bell curve, enzyme-specific optimum</text>
</g>
<g transform="translate(470,15)">
<line x1="20" y1="105" x2="185" y2="105" stroke="#94a3b8"/><line x1="20" y1="15" x2="20" y2="105" stroke="#94a3b8"/>
<path d="M 22 103 Q 70 25 100 40 T 183 42" fill="none" stroke="#0369a1" stroke-width="2.4"/>
<text x="102" y="128" text-anchor="middle">substrate conc.</text><text x="102" y="145" text-anchor="middle" fill="#5b6478">rises then plateaus (Vmax)</text>
</g>
</g></svg>
<p class="figcap">Same three curve shapes recur in photosynthesis — because the same enzyme logic applies.</p>
<table>
<tr><th>Factor</th><th>Below optimum</th><th>At optimum</th><th>Above optimum / excess</th></tr>
<tr><td><b>Temperature</b></td><td>Low energy → few successful collisions → slow rate</td><td>Maximum rate</td><td>Active site changes shape (denatures) → rate falls to zero</td></tr>
<tr><td><b>pH</b></td><td>H⁺/OH⁻ interfere with bonding → shape disturbed → slow</td><td>Maximum rate <b>(enzyme-specific — pepsin ~2, most others ~7)</b></td><td>Denatures at extreme pH → rate falls to zero</td></tr>
<tr><td><b>Substrate concentration</b></td><td>More substrate → more collisions → rate rises</td><td>—</td><td><b>Plateau</b>: all active sites are occupied; adding more substrate changes nothing</td></tr>
</table>
<p class="muted">Extension: <b>competitive inhibition</b> — a molecule shaped like the substrate occupies the active site (overcome by adding more substrate). <b>Non-competitive inhibition</b> — a molecule binds elsewhere and changes the active site's shape (can't be overcome). Same shape-logic as denaturation.</p>

<h4>6 · Enzyme practicals</h4>
<ul>
<li><b>Amylase + starch + iodine:</b> time how long the iodine stops turning blue-black — the iodine test tracks starch disappearing; temperature is the IV. Controls: same starch/amylase volume, same starting temperature.</li>
<li><b>Catalase + hydrogen peroxide:</b> measure the <b>height of the foam column</b> (oxygen released) in a fixed time — a classic substrate-concentration or temperature investigation.</li>
</ul>`,

{cmd:'Describe',t:'Enzymes',d:2,q:'Describe the three factors that affect enzyme function, including the shape of each graph.',a:'(1) Temperature — rate rises to an optimum (more kinetic energy, more successful collisions) then falls sharply as the enzyme denatures: a bell curve. (2) pH — same bell shape, but the optimum pH is enzyme-specific (pepsin ~2; most enzymes ~7); extreme pH denatures. (3) Substrate concentration — rate rises as more substrate means more collisions, then plateaus once all active sites are occupied.'},
{cmd:'Compare',t:'Enzymes',d:2,q:'Compare the induced fit model to the lock and key model.',a:'Lock and key: the active site is a rigid, exact complement of the substrate, which neatly explains specificity but not catalysis. Induced fit: the active site is flexible and moulds around the bound substrate, which explains specificity AND catalysis (the moulding strains substrate bonds, lowering the energy needed) and how related molecules can bind. Induced fit is the currently accepted model; both agree the enzyme is unchanged after the reaction.'},
{cmd:'Explain',t:'Enzymes',d:3,q:'Explain why boiling an enzyme solution permanently stops its activity, but cooling the same solution only slows it.',a:'Heat above the optimum increases vibration that breaks the bonds holding the enzyme\'s 3-D shape; the active site is permanently deformed (denatured) so the substrate can no longer bind — the loss of activity is irreversible. Cooling merely slows molecular motion, so fewer successful enzyme–substrate collisions occur per second; the shape is intact and activity returns on reheating. Boiling destroys structure; cooling only reduces energy.'},
{cmd:'Evaluate',t:'Data',d:3,q:'A student measures catalase activity: foam height 12 mm at 0 mM H₂O₂, 45 mm at 35 mM, 58 mm at 70 mM, 41 mm at 140 mM. Hypothesis: "increasing substrate concentration results in greater catalase activity." Evaluate using all the data.',a:'Supported in part: activity rises steeply from 0 to 70 mM — more substrate means more frequent successful collisions with catalase active sites, so the rate increases. Not supported beyond 70 mM: activity falls to 41 mm at 140 mM, so the hypothesis holds only up to a peak, not without limit. Limitations: single measurements (no repeats to judge reliability), no temperature control stated, and foam height is a proxy for oxygen volume — bubble size varies. Conclusion: the hypothesis is supported only up to an optimum substrate concentration, beyond which activity declines.'},
{cmd:'Design',t:'Practical',d:3,q:'Design a practical to test the effect of temperature on the amylase–starch reaction.',a:'IV = temperature (water baths at 0, 20, 40, 60, 80°C). DV = time taken for starch to disappear (tested with iodine drops on a white tile at 30-second intervals). CVs = same volumes of starch and amylase, same starch concentration, same iodine volume, same equilibration time at each temperature before mixing. Hypothesis: rate rises to about 40°C then falls as amylase denatures; sketch a bell curve. Method: equilibrate enzyme and substrate in the bath, mix, sample every 30 s until iodine stays orange-brown (starch gone). Safety: water baths near electrical equipment; eye protection.'},
{cmd:'Explain',t:'Application',d:3,q:'Explain why a baby fed only on milk (high fat) produces more lipase than an adult on a starch-heavy diet.',a:'Digestive enzyme production adapts to diet: lipase breaks lipids into fatty acids and glycerol, so a high-fat, low-carbohydrate milk diet creates demand for more lipase to digest and absorb enough energy. An adult starch-heavy diet demands more amylase instead. Enzymes are expensive proteins for the body to make, so production is tuned to the substrate actually being eaten.'}
]},
eval:{id:'eval',name:'Evaluation & Data Skills',short:'Evaluation',color:'#475569',icon:'📊',
blurb:'Command terms, the five-part evaluation recipe, and how to squeeze marks out of any graph or data set.',
notes:`<h4>1 · Command terms — what each one is asking for</h4>
<table>
<tr><th>Term</th><th>What it demands</th><th>Typical marks</th></tr>
<tr><td><b>State / Give / Name</b></td><td>A one-word or one-sentence answer — no explanation</td><td>1</td></tr>
<tr><td><b>Outline</b></td><td>A brief account, essentials only — no detail</td><td>1–2</td></tr>
<tr><td><b>Describe</b></td><td>Say what happens, in order, with the science detail — "what"</td><td>2–4</td></tr>
<tr><td><b>Explain</b></td><td>Describe <b>plus</b> give reasons — "why/so" — every effect needs a cause</td><td>3–5</td></tr>
<tr><td><b>Compare</b></td><td>Describe <b>both</b> and state a similarity AND a difference — a table or paired structure works</td><td>3–4</td></tr>
<tr><td><b>Evaluate</b></td><td>Weigh strengths and limitations, then a justified verdict</td><td>4–6</td></tr>
<tr><td><b>Discuss</b></td><td>Give arguments on both sides then a conclusion — like evaluate, more discursive</td><td>4–6</td></tr>
<tr><td><b>Justify</b></td><td>Give evidence/reasons to support a specific claim</td><td>2–4</td></tr>
<tr><td><b>Design</b></td><td>IV, DV, CVs, hypothesis, method, safety — the full practical recipe</td><td>5–8</td></tr>
<tr><td><b>Suggest / Predict</b></td><td>Apply your science to a new scenario with reasoning</td><td>2–3</td></tr>
</table>
<div class="callout tip"><b>The single most common lost-mark move:</b> answering "describe" when the question says "explain". If the verb is <b>explain</b>, every statement needs a <i>because…</i> behind it. If it says <b>evaluate</b>, you must reach the end — verdicts without limitations and limitations without a verdict both lose the top marks.</div>

<h4>2 · The five-part evaluation recipe</h4>
<ol>
<li><b>Overall trend:</b> state what the data show across the whole set, and say whether the claim looks supported.</li>
<li><b>Supports:</b> cite <b>specific data values</b> — never "the data shows an increase", always "from X to Y between year A and year B" — plus the scientific reason.</li>
<li><b>Does not support / limits:</b> cite the contradicting part with specific data, then the design limitations: <b>overlapping error bars, single sample/species/location, uncontrolled variables (age, sex, diet), limited time range, measurement method precision.</b></li>
<li><b>Weigh:</b> say which side is stronger — "supported for 1987–96 but not for 2003–09" is a weighing, not a list.</li>
<li><b>Concluding statement:</b> a qualified verdict — "overall the claim is supported, provided that…". Never a bare yes/no.</li>
</ol>

<h4>3 · Reading any data set (use this order every time)</h4>
<table>
<tr><th>Step</th><th>What you check</th><th>Why it scores</th></tr>
<tr><td>1 · Axes</td><td>Both axes, their units, whether scales are linear</td><td>Stops you describing the wrong variable</td></tr>
<tr><td>2 · Trend</td><td>Rising / falling / plateau / cyclical / no relationship — quote a start and end value</td><td>The evidence sentence</td></tr>
<tr><td>3 · Specific points</td><td>Peak, trough, where the trend changes (e.g. the decline after 70 mM)</td><td>The "specific data point" marks</td></tr>
<tr><td>4 · Error bars</td><td>Do the ranges of two conditions <b>overlap</b>? Overlap = difference may not be significant</td><td>The limitation mark — examiners plant this on purpose</td></tr>
<tr><td>5 · Design</td><td>Sample size, one species/location, uncontrolled variables</td><td>Generalisation limits</td></tr>
<tr><td>6 · Correlation ≠ cause</td><td>Two variables rising together doesn't prove one causes the other</td><td>Top-band discriminator</td></tr>
</table>

<h4>4 · Worked evaluations (model the shape, not the topic)</h4>
<div class="card"><b>Model 1 — "CO₂ has been rising constantly for the past 50 years."</b><br>Overall: a strong positive correlation between time and CO₂ — broadly supported. Supports: in the 1960s levels were around 320 ppm; by 2020 close to 420 ppm. Does not support: CO₂ <b>decreases within each year</b> (the yearly downward trend is visible in the data) and only <b>one location</b> was measured, so the pattern may not be representative. Weigh: the yearly averages all rise even though there are short-term decreases. Conclusion: supported overall — "constantly" is too strong because of the seasonal dips, but the 50-year average trend is unambiguously upward.</div>
<div class="card"><b>Model 2 — Catalase: "increasing H₂O₂ concentration results in greater catalase activity."</b><br>Supported in part: activity rises from 0 to 70 mM because higher substrate concentration means more frequent successful collisions with the active sites. Not supported beyond that: activity <b>declines from 70 mM onward</b>, and the peak is at 70 mM. Limitations: error bars overlap, so some differences may not be significant; only <b>one bacterium</b> (<i>Vibrio rumoiensis</i>) was tested, so the conclusion cannot be generalised to other species. Conclusion: partially supported — activity increases with substrate concentration only <b>up to an optimum</b>.</div>
<div class="card"><b>Model 3 — "Patients with diabetes have a higher risk of mortality from CHD."</b><br>Supported for the 1987–96 data: patients without diabetes had a lower CHD mortality rate (cite the values). Possibly not supported for 2003–09: CHD mortality rates for the two groups are <b>similar</b> (cite values). Also: CHD mortality among diabetics has <b>decreased</b> over time while non-diabetics' has increased; the 2003–09 error bars are large and overlap, so no firm conclusion is possible; and <b>no data on gender, age or obesity</b> — confounding variables. Conclusion: supported by the earlier data, but the recent data make the present-day claim uncertain — a time-qualified verdict.</div>

<h4>4b · Fresh practice evaluations (answers in the Question Bank tab)</h4>
<ul>
<li>Enzyme–temperature practical data with a peak at 40°C and a collapse at 60°C.</li>
<li>Heart rate during exercise: 72 → 98 → 120 → 128 → 128 → 130 bpm over five minutes.</li>
<li>Pondweed bubble counts at lamp distances 10/20/40/80 cm.</li>
<li>Leaf transpiration rates at different humidities with overlapping error bars.</li>
</ul>

<h4>5 · Design command term — the checklist</h4>
<table>
<tr><td><b>IV</b> — the one factor you change, with its range and units, and <i>how</i> you'll change it</td></tr>
<tr><td><b>DV</b> — what you measure, with units and the instrument</td></tr>
<tr><td><b>CVs</b> — everything held constant, <b>with the reason each one matters</b> (marks for the why)</td></tr>
<tr><td><b>Hypothesis</b> — scientific reasoning behind the prediction + a sketch graph</td></tr>
<tr><td><b>Method</b> — step-by-step, with repeats and averaging</td></tr>
<tr><td><b>Safety</b> — the real hazards of the specific apparatus (electrics near water, hot lamps, indicators)</td></tr>
</table>`,
cards:[
{q:'What does the command term "evaluate" demand?',a:'Weigh up strengths and limitations, then reach a justified, qualified verdict — argument both sides + conclusion.'},
{q:'"Describe" vs "explain"',a:'Describe = what happens, in order. Explain = what happens + why (every effect needs a because).'},
{q:'"Compare" — what earns full marks?',a:'Describe BOTH things and state an explicit similarity AND an explicit difference — a two-column structure rarely misses marks.'},
{q:'Overlapping error bars mean…',a:'The difference between the two conditions may not be significant — you cannot claim one is definitely larger.'},
{q:'Correlation vs causation',a:'Two variables rising together doesn\'t prove one causes the other — a third variable may drive both.'},
{q:'Name four limitations you can cite in any evaluation',a:'Small sample size; only one species/location; uncontrolled variables (age, sex, diet); measurement precision / no repeats.'},
{q:'What makes a strong "specific data point" sentence?',a:'Quoting actual values: "from 320 ppm in the 1960s to 420 ppm in 2020" — not "it increased a lot".'},
{q:'Evaluate: what must the final sentence be?',a:'A qualified verdict — "overall supported, provided that…" — never a bare yes or no.'},
{q:'Design question: what earns marks in CVs?',a:'The reason each one is controlled, not just naming it — "temperature controlled because enzymes denature above their optimum".'},
{q:'What does a plateau in a rate graph always mean?',a:'A different factor has become limiting — the factor you varied is no longer the constraint.'},
{q:'"State" vs "outline"',a:'State = a fact, no explanation. Outline = a brief account of the essentials.'},
{q:'Hypothesis in a design question',a:'Prediction + scientific reasoning + a sketch graph — not just a guess.'}
],
quiz:[
{q:'A question says "Evaluate the conclusion that X is caused by Y." The best answer structure is…',o:['a list of facts about X','trend + supporting data + contradicting data + limitations + qualified conclusion','a definition of X','a single sentence saying "yes"'],a:1,e:'That is the five-part evaluation recipe — a list of facts scores nothing for evaluation.'},
{q:'Error bars of two conditions overlap. The correct statement is…',o:['the difference is definitely significant','the difference may not be significant','the data are wrong','the sample size was perfect'],a:1,e:'Overlap = you cannot be sure the difference is real, not measurement noise.'},
{q:'"Light intensity and bubble count both rise, so light causes the rate." The flaw is…',o:['nothing — the logic is sound','correlation is being treated as causation without controlling other factors','light cannot affect photosynthesis','bubbles don\'t measure rate'],a:1,e:'nThis is a planted trap: temperature or CO₂ could be changing too, so a controlled experiment is needed to prove cause.'},
{q:'Which sentence is a specific data point?',o:['"CO₂ went up a lot"','"mortality decreased"','"from 320 ppm in the 1960s to 420 ppm in 2020"','"the trend is positive"'],a:2,e:'Only option C quotes actual values with time context — that\'s what the mark scheme rewards.'},
{q:'The command term "outline" asks for…',o:['a full essay','a brief account of the essentials only','a labelled diagram','a judgement'],a:1,e:'Outline = essentials, one or two lines, no detail.'},
{q:'In a design answer, a controlled variable earns marks when you…',o:['name it','name it and say why it must be controlled','draw it','guess its value'],a:1,e:'CVs are marked on the reason: "temperature controlled because enzymes denature above the optimum".'},
{q:'A rate graph plateaus. The best explanation is…',o:['the reaction stopped','another factor became limiting','the equipment broke','the substrate is toxic'],a:1,e:'Plateau = saturation — the varied factor is no longer the constraint.'},
{q:'"Justify" asks you to…',o:['describe a process','give reasons and evidence to support a specific claim','list every fact you know','compare two things'],a:1,e:'Justify = evidence for one side of an argument.'},
{q:'An evaluation conclusion should be…',o:['"the claim is correct"','"the claim is wrong"','"supported overall, provided that overlapping error bars are considered"','left out to save time'],a:2,e:'Qualified verdict — acknowledge the strength of evidence and the limits.'},
{q:'Only one species was used in a study. The evaluation limitation is…',o:['the result cannot be generalised to other species','the result is definitely true','error bars must overlap','the sample is too varied'],a:0,e:'Single-species studies limit generalisation — that\'s a standard limitation mark.'}
],
bank:[
{cmd:'Evaluate',t:'Data',d:2,q:'Evaluate the conclusion that CO₂ concentrations have been rising constantly for the past 50 years.',a:'Overall there is a strong positive correlation between time and CO₂, so the claim is broadly supported — in the 1960s levels were around 320 ppm, but by 2020 they were close to 420 ppm. However, "constantly" is too strong: CO₂ decreases during certain periods within each year (the yearly downward trend), and only one location was measured, so the pattern may not be representative of the world. Weighing these: the yearly averages do all increase even though short-term decreases occur. Conclusion: the conclusion is supported overall, with the caveat that rises are not continuous within the year.'},
{cmd:'Evaluate',t:'Data',d:3,q:'Evaluate whether the hypothesis "increasing concentrations of hydrogen peroxide results in greater catalase activity" is supported by the study of Vibrio rumoiensis.',a:'Partially supported. It is supported from 0 to 70 mM: catalase activity increases as substrate concentration rises, because more substrate means more frequent successful collisions with the enzyme active sites. It is not supported from 70 mM onward: activity declines rather than continuing to rise, so the peak is at 70 mM. Limitations: the error bars overlap, so some differences may not be significant, and only one bacterial species was tested, so the conclusion cannot be generalised. Conclusion: the hypothesis is supported only up to an optimum substrate concentration.'},
{cmd:'Evaluate',t:'Data',d:3,q:'Using the data, evaluate the claim that patients with diabetes have a higher risk of mortality from CHD.',a:'Supported for the 1987–96 data: patients without diabetes had a lower CHD mortality rate than patients with diabetes (cite specific values). Possibly not supported for the 2003–09 data: the CHD mortality rate is similar for the two groups (cite values). Over time, CHD mortality in diabetes patients has decreased while it has increased for non-diabetics. Limitations: the 2003–09 error bars are large and overlapping, so no firm conclusion can be drawn there; and there is no data on gender, age or obesity, which are confounding variables. Conclusion: the claim is supported by the earlier data but the recent data make the present-day claim uncertain.'},
{cmd:'Evaluate',t:'Data',d:3,q:'A student measures amylase reaction time at different temperatures: fastest at 37°C, much slower at 60°C, none at 80°C. Evaluate the conclusion that "enzymes work faster the hotter it gets."',a:'Supported only up to a point: the reaction is fastest at 37°C because higher temperature gives more kinetic energy and more successful enzyme–substrate collisions. Not supported above the optimum: at 60°C the reaction is much slower and at 80°C it stops, because the amylase denatures — the active site loses its shape and the substrate no longer fits. Limitations: no repeats or error bars stated, so differences may not be reliable; one enzyme (amylase) and one substrate only, so the conclusion cannot be generalised to all enzymes. Conclusion: the claim is true only below the optimum; above it, denaturation reverses the trend.'},
{cmd:'Evaluate',t:'Data',d:3,q:'Pondweed bubble counts: 10 cm from lamp = 62/min, 20 cm = 41/min, 40 cm = 18/min, 80 cm = 4/min. Evaluate the conclusion that "the rate of photosynthesis is inversely proportional to distance from the lamp."',a:'Supported qualitatively: closer to the lamp = more bubbles = higher rate, consistent with more light photo-activating more chlorophyll. But "inversely proportional to distance" is the wrong relationship: light intensity falls with the <i>square</i> of the distance (inverse-square law), and halving the distance should roughly quadruple the rate — the data show roughly 1.5× per step, which does not match inverse proportionality (or even inverse-square, suggesting other factors such as CO₂ also limit the rate at high light). Limitations: single counts at each distance, no repeats or error bars, temperature not controlled, and bubble size assumed constant. Conclusion: the rate clearly falls with distance, but the exact proportional relationship claimed is not supported.'},
{cmd:'Discuss',t:'Data',d:3,q:'Discuss whether a strong correlation between two variables in a study proves that one causes the other.',a:'It suggests but does not prove causation. Supporting: a plausible mechanism, a consistent dose–response relationship and experimental control of other variables all strengthen a causal claim. Against: a third confounding variable may drive both (e.g. ice-cream sales and drowning correlate because both rise in summer); correlation can be coincidence; and without a controlled experiment with randomised or matched samples, causality cannot be established. Conclusion: correlation is evidence for a possible mechanism but causality requires controlled experimental design — and even then only "supports", rarely "proves".'},
{cmd:'Design',t:'Practical',d:3,q:'Design an experiment to test the effect of light intensity on the rate of photosynthesis.',a:'IV = distance of a lamp from the pondweed (10–80 cm) — halving distance raises intensity; DV = O₂ bubbles counted per minute (or volume of gas collected over 3 min). CVs = same piece of pondweed, same volume and temperature of water (equilibrate 2 min), same sodium hydrogencarbonate concentration, same counting time; each condition repeated 3× and averaged. Hypothesis: rate increases as light intensity increases, then plateaus when all chlorophyll is saturated; sketch the graph. Method: set distance, settle, count for 1 min, repeat at each distance, plot rate against 1/distance². Safety: keep the lamp and electrics away from water; let the lamp cool before moving.'},
{cmd:'Explain',t:'Method',d:2,q:'Explain why repeating measurements and calculating a mean is important in a practical.',a:'Repeats reveal random variation (e.g. inconsistent bubble production, slight timing errors) so anomalies can be identified and excluded; a mean of several values reduces the effect of any single anomalous or mistimed measurement, giving a value closer to the true rate. Without repeats, a single measurement could be genuine but unrepresentative, and no error bars can be drawn to judge whether differences between conditions are significant.'},
{cmd:'Justify',t:'Method',d:2,q:'Justify why a water bath, rather than a Bunsen burner, is used to control temperature in an enzyme experiment.',a:'A water bath holds the temperature steady within about ±1°C, so the enzyme stays at a known temperature for the whole reaction — essential because enzyme activity changes drastically with temperature, and above the optimum it denatures. A Bunsen flame heats unevenly and cannot maintain a set point, so temperature would drift and the reaction rate would no longer be attributable to the intended IV.'},
{cmd:'Evaluate',t:'Exam skill',d:3,q:'A student\'s answer to "Explain why breathing rate increases during exercise" says: "Because you need more oxygen." Evaluate the quality of this answer.',a:'Correct in direction but incomplete: it states the outcome without the mechanism. Marks are missed at each missing link — (1) muscles respire faster to release more ATP for contraction; (2) so they use more O₂ and produce more CO₂; (3) blood returning to the lungs is therefore low in O₂ and high in CO₂; (4) which increases the concentration gradients at the alveoli; (5) so faster and deeper breathing restores them, supplying O₂ and removing CO₂. The answer also misses the CO₂-acidity point. To improve: never stop at "because you need more" — follow the chain to the gradient, then to the response.'}
]},

elow it","a thin wall is enough because the blood is travelling a very short distance","there are two: right receives deoxygenated blood, left receives oxygenated","ventricle - the thick-walled chamber that pumps blood out","aorta - the largest artery leaving the heart","septum - the wall dividing the two sides"],["cardi","chambers",1,"ventricle","a thick-walled chamber that pumps blood out of the heart","its thick muscle generates the pressure needed to send blood away","the left ventricle is thickest because it pumps to the whole body","the right ventricle only pumps to the lungs, so its wall is thinner","atrium - the thin-walled receiving chamber","vena cava - the large vein entering the right atrium","valve - a flap that prevents backflow"],["cardi","chambers",2,"septum","the muscular wall dividing the left and right sides of the heart","it physically separates oxygenated from deoxygenated blood","the two streams never mix, so the body receives fully oxygenated blood","a hole in it is a septal defect, mixing the two streams","pericardium - the sac around the heart","septum of the lungs - no such structure","valve - a flap, not a dividing wall"],["cardi","chambers",2,"left ventricle","the chamber with the thickest muscular wall","it must generate enough pressure to drive blood around the entire body","its wall is roughly three times thicker than the right ventricle","this is why the left ventricle is the one that fails in heart disease","right ventricle - pumps only to the lungs at lower pressure","left atrium - receives blood from the lungs","aorta - the vessel it pumps into"],["cardi","vessels",1,"vena cava","the largest vein, returning deoxygenated blood to the right atrium","it drains blood from the head, limbs and trunk","it is a vein, so it carries blood towards the heart at low pressure","the superior and inferior vena cava are the two branches","aorta - the largest artery, carrying blood away","pulmonary vein - carries oxygenated blood to the left atrium","pulmonary artery - carries deoxygenated blood to the lungs"],["cardi","vessels",2,"pulmonary artery","the vessel carrying deoxygenated blood from the right ventricle to the lungs","it is the only artery that carries deoxygenated blood","it delivers blood to the alveoli where it picks up oxygen","it is an artery because it leaves the heart, not because of its oxygen content","pulmonary vein - carries oxygenated blood back to the left atrium","aorta - carries oxygenated blood to the body","vena cava - carries deoxygenated blood to the right atrium"],["cardi","vessels",2,"pulmonary vein","the vessel carrying oxygenated blood from the lungs to the left atrium","it is the only vein that carries oxygenated blood","it delivers freshly oxygenated blood ready for the left ventricle to pump out","it is a vein because it returns blood to the heart, not because of its oxygen content","pulmonary artery - carries deoxygenated blood to the lungs","vena cava - carries deoxygenated blood from the body","aorta - carries oxygenated blood away from the heart"],["cardi","vessels",1,"aorta","the largest artery, carrying oxygenated blood from the left ventricle to the body","its thick elastic wall stretches with each surge of blood","it maintains high pressure so blood reaches every tissue","it branches into the coronary arteries just above the valve","vena cava - the largest vein","pulmonary artery - leaves the right ventricle","carotid artery - a branch of the aorta supplying the head"],["cardi","vessels",1,"artery","a vessel carrying blood away from the heart","it has a thick muscular and elastic wall and a narrow lumen","it withstands and maintains the high pressure created by ventricular contraction","the elastic recoil keeps blood moving between beats","vein - thin wall, wide lumen, valves, carries blood to the heart","capillary - one cell thick, site of exchange","arteriole - the small vessel between artery and capillary"],["cardi","vessels",1,"vein","a vessel carrying blood towards the heart","it has a thin wall, a wide lumen and valves along its length","valves stop blood sliding backwards because pressure is low","skeletal muscle squeezing helps push blood along","artery - thick wall, narrow lumen, carries blood away","capillary - one cell thick, exchange surface","venule - the small vessel draining a capillary bed"],["cardi","vessels",1,"capillary","the smallest blood vessel, one cell thick","its wall is a single layer of flattened cells","substances diffuse easily between blood and tissue in both directions","its total cross-sectional area is huge, so flow slows and exchange has time","artery - thick walled, carries blood away from the heart","vein - thin walled, carries blood back","lymph vessel - drains tissue fluid, not blood"],["cardi","vessels",3,"arteriole","the small vessel between an artery and a capillary bed","its wall is mostly smooth muscle, so its diameter can change","constriction reduces flow into that capillary bed and raises resistance","this is how the body redirects blood during exercise","venule - the small vessel draining capillaries","artery - the larger vessel upstream","capillary - the exchange vessel downstream"],["cardi","valves",1,"valve","a flap of tissue that keeps blood flowing one way","it is pushed open by flow and forced shut by backflow","it prevents blood from moving backwards through the heart or veins","the sound of the heartbeat is largely valves snapping shut","septum - a dividing wall, not a flap","sphincter - a ring of muscle that closes a tube","lumen - the channel inside a vessel"],["cardi","valves",3,"bicuspid valve","the valve between the left atrium and left ventricle","it has two flaps and closes when the ventricle contracts","it stops blood being forced back into the atrium during systole","also called the mitral valve","tricuspid valve - between right atrium and right ventricle","semi-lunar valve - at the exit of the ventricles","septum - the wall between the ventricles"],["cardi","valves",3,"tricuspid valve","the valve between the right atrium and right ventricle","it has three flaps and shuts as the right ventricle contracts","it prevents backflow into the right atrium","the right side handles deoxygenated blood, but the valve works identically","bicuspid valve - the two-flap valve on the left side","semi-lunar valve - at the artery exits","vena cava - the vessel entering the right atrium"],["cardi","valves",3,"semi-lunar valve","a valve at the base of the aorta and the pulmonary artery","its cup-shaped cusps fill and close when blood tries to fall back","it stops blood in the arteries from draining back into the ventricles","there are two: aortic and pulmonary","bicuspid valve - between left atrium and ventricle","tricuspid valve - between right atrium and ventricle","valve in a vein - prevents backflow along the limb"],["cardi","blood",1,"plasma","the liquid component of blood, about 55 percent by volume","it is mostly water with dissolved glucose, salts, hormones, urea and proteins","it transports these substances and most of the carbon dioxide","it is the transport medium, not a cell","serum - plasma without clotting proteins","lymph - tissue fluid in lymph vessels","haemoglobin - a protein inside red cells, not the plasma itself"],["cardi","blood",1,"red blood cell","the biconcave cell that transports oxygen","it has no nucleus and is packed with haemoglobin","it carries oxygen from lungs to tissues and some CO2 back","it lives about 120 days and cannot divide","white blood cell - defends against pathogens","platelet - a fragment that causes clotting","plasma cell - an antibody-producing immune cell"],["cardi","blood",1,"white blood cell","a nucleated blood cell of the immune system","some engulf pathogens by phagocytosis, others produce antibodies","they defend the body against infection","they are far fewer than red cells but can leave the blood vessel","red blood cell - carries oxygen","platelet - causes clotting","neurone - a nerve cell"
